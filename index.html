function renderListaMaterialDetalhe() {
  const l = state.listaMaterialAtual;
  if (!l) { state.view='listaMaterial'; return renderListaMaterial(); }

  const UNIDADES = ['un','m','m²','m³','kg','g','L','ml','sc','cx','br','vb','gl','hr'];

  return `
    <div class="stack">
      <div class="row-between" style="align-items:center;">
        <button class="back-btn" onclick="actions.irParaListaMaterial()">${ICON.chevronLeft} Listas</button>
        <h1 style="font-size:17px;font-weight:700;color:var(--primary);margin:0;">Detalhes</h1>
        <div class="row" style="gap:6px;">
          <button class="btn btn-ghost btn-sm" onclick="actions.compartilharListaMaterial()">${ICON.share}</button>
          <button class="btn btn-secondary btn-sm" onclick="actions.imprimirListaMaterial()">${ICON.printer}</button>
        </div>
      </div>

      <div class="card">
        <div class="form-group"><label>Nome da lista</label>
          <input type="text" value="${esc(l.nome)}" placeholder="Ex: Fundação bloco A"
            oninput="actions.listaMaterialCampo('nome',this.value)"></div>
        <div class="form-group"><label>Obra (texto livre)</label>
          <input type="text" value="${esc(l.obra)}" placeholder="Ex: Res. Silva - Ilhéus"
            oninput="actions.listaMaterialCampo('obra',this.value)"></div>
        <div class="form-group"><label>Responsável (opcional)</label>
          <input type="text" value="${esc(l.responsavel||'')}" placeholder="Seu nome"
            oninput="actions.listaMaterialCampo('responsavel',this.value)"></div>
      </div>

      <!-- Itens da lista -->
      ${l.itens.length===0
        ? `<div class="card empty" style="padding:20px;">${ICON.package}<div class="empty-msg">Nenhum item.<br>Adicione abaixo.</div></div>`
        : `<div class="card" style="padding:0;overflow:hidden;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead>
              <tr style="background:var(--bg-soft);">
                <th style="padding:8px 10px;text-align:left;font-size:11px;color:var(--muted);font-weight:700;">ITEM</th>
                <th style="padding:8px 6px;text-align:right;font-size:11px;color:var(--muted);font-weight:700;width:60px;">QTD</th>
                <th style="padding:8px 6px;text-align:left;font-size:11px;color:var(--muted);font-weight:700;width:52px;">UN</th>
                <th style="width:32px;"></th>
              </tr>
            </thead>
            <tbody>
              ${l.itens.map((item,idx)=>`
                <tr style="border-bottom:1px solid var(--border);">
                  <td style="padding:6px 10px;">
                    <input type="text" value="${esc(item.desc)}" placeholder="Descrição..."
                      style="border:none;background:none;width:100%;font-size:13px;"
                      onchange="actions.itemListaCampo(${idx},'desc',this.value)">
                    ${item.obs?`<div style="font-size:10px;color:var(--muted);">${esc(item.obs)}</div>`:''}
                  </td>
                  <td style="padding:6px 4px;">
                    <input type="text" inputmode="decimal" value="${esc(item.qtd)}" placeholder="0"
                      style="border:none;background:none;width:54px;text-align:right;font-weight:700;font-size:13px;"
                      onchange="actions.itemListaCampo(${idx},'qtd',this.value)">
                  </td>
                  <td style="padding:6px 4px;">
                    <select style="border:none;background:none;font-size:12px;padding:0;"
                      onchange="actions.itemListaCampo(${idx},'un',this.value)">
                      ${UNIDADES.map(u=>`<option ${item.un===u?'selected':''}>${u}</option>`).join('')}
                    </select>
                  </td>
                  <td style="padding:6px 4px;text-align:center;">
                    <button onclick="actions.excluirItemLista(${idx})"
                      style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:16px;">✕</button>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`}

      <!-- Adicionar item -->
      <div class="card" style="background:var(--bg-soft);">
        <div class="card-title">Adicionar item</div>
        <div class="form-group"><label>Descrição</label>
          <input type="text" id="novo-item-desc" placeholder="Ex: Tijolo cerâmico 9×14×19cm"
            onkeydown="if(event.key==='Enter')actions.adicionarItemLista()"></div>
        <div class="row" style="gap:8px;">
          <div class="form-group" style="flex:1;margin:0;"><label>Qtd</label>
            <input type="text" id="novo-item-qtd" inputmode="decimal" placeholder="0"></div>
          <div class="form-group" style="width:80px;margin:0;"><label>Unidade</label>
            <select id="novo-item-un">
              ${UNIDADES.map(u=>`<option>${u}</option>`).join('')}
            </select></div>
        </div>
        <div class="form-group" style="margin-top:8px;"><label>Obs. (opcional)</label>
          <input type="text" id="novo-item-obs" placeholder="Marca, cor, especificação..."></div>
        <button class="btn btn-primary" style="width:100%;margin-top:4px;" onclick="actions.adicionarItemLista()">
          ${ICON.plus} Adicionar à lista
        </button>
      </div>

      <div class="card" style="font-size:11px;color:var(--muted);">
        ${l.itens.length} iten(s) · ${fmtData(l.data)}
        ${l.obra?` · Obra: ${esc(l.obra)}`:''}
      </div>
    </div>`;
}

                onclick="event.stopPropagation();actions.excluirDiarioObra('${o.id}')">✕</button>

}

// === ACTIONS ===
const actions={
  irHome(){state.view='home';render();},
  irConfiguracoes(){state.view='configuracoes';render();},
  irParaAlvenaria(){state.view='alvenaria';render();},
  irParaTelhado(){state.view='telhado';render();},
  irParaDrywall(){state.view='drywall';render();},
  irParaMedicaoCeramica(){state.view='medicaoCeramica';state.medicaoCeramicaAtual=null;render();},
  irParaConcreto(){ state.view='concreto'; render(); },
  concretoAba(v){ state.concreto.aba=v; state.concreto.form={}; render(); },
  concretoModo(v){ state.concreto.modo=v; render(); },
  concretoConfig(campo,val){
    if(campo==='fck') state.concreto.fck=parseInt(val)||25;
    else if(campo==='perda') state.concreto.perda=parseFloat(String(val).replace(',','.'))||10;
    else state.concreto[campo]=val;
    save('concreto'); render();
  },
  concretoForm(campo,val){ state.concreto.form[campo]=val; },
  concretoToggle(campo,val){
    state.concreto[campo]=val; state.concreto.form={}; render();
  },
  addConcretoItem(){
    const c=state.concreto; const f=c.form||{}; const aba=c.aba;
    const nome=f.nome||'';
    const pf=v=>parseFloat(String(v||0).replace(',','.'))||0;
    let vol=0;
    if(aba==='lajes'){
      const comp=pf(f.comprimento), larg=pf(f.largura), esp=pf(f.espessura)||0.12, area=pf(f.area);
      vol=c.lajeMetodo==='area' ? area*esp : comp*larg*esp;
      if(vol>0) c.lajes.push({id:'l'+Date.now(),nome,
        metodo:c.lajeMetodo,
        comprimento:f.comprimento||'',largura:f.largura||'',
        espessura:f.espessura||'0.12',area:f.area||''});
    } else if(aba==='pilares'){
      const b=pf(f.b),h=pf(f.h),diam=pf(f.diametro),alt=pf(f.altura),qtd=pf(f.quantidade)||1;
      const tipo=c.pilarTipo;
      const sec=tipo==='circular' ? Math.PI*Math.pow(diam/2,2) : b*h;
      vol=sec*alt*qtd;
      if(vol>0) c.pilares.push({id:'p'+Date.now(),nome,tipo,
        b:f.b||'',h:f.h||'',diametro:f.diametro||'',
        altura:f.altura||'',quantidade:f.quantidade||'1'});
    } else if(aba==='vigas'){
      const b=pf(f.b),h=pf(f.h),comp=pf(f.comprimento),qtd=pf(f.quantidade)||1;
      vol=b*h*comp*qtd;
      if(vol>0) c.vigas.push({id:'v'+Date.now(),nome,
        b:f.b||'',h:f.h||'',comprimento:f.comprimento||'',quantidade:f.quantidade||'1'});
    } else if(aba==='sapatas'){
      const a=pf(f.a),b=pf(f.b),h=pf(f.h),qtd=pf(f.quantidade)||1;
      vol=a*b*h*qtd;
      if(vol>0) c.sapatas.push({id:'s'+Date.now(),nome,tipo:c.sapataTipo,
        a:f.a||'',b:f.b||'',h:f.h||'',quantidade:f.quantidade||'1'});
    }
    if(vol<=0){showToast('Informe as dimensões','erro');return;}
    save('concreto'); state.concreto.form={}; render();
  },
  removeConcretoItem(aba,id){
    state.concreto[aba]=state.concreto[aba].filter(x=>x.id!==id);
    save('concreto'); render();
  },
  limparConcreto(){
    state.concreto.lajes=[]; state.concreto.pilares=[];
    state.concreto.vigas=[]; state.concreto.sapatas=[];
    state.concreto.form={}; save('concreto'); render();
  },
  abrirDocConcreto(){ state.view='concretoDoc'; render(); setTimeout(()=>window.print(),400); },
  async compartilharListaConcreto(){
    const r=calcularConcreto();
    const txt=montarTextoConcreto(r);
    try{if(navigator.share)await navigator.share({text:txt});
      else{await navigator.clipboard.writeText(txt);showToast('Copiado!','sucesso');}}catch(e){}
  },
  irParaListaMaterial(){state.view='listaMaterial';render();},
  novaListaMaterial(){
    const l={id:'lm_'+Date.now(),nome:'',obra:'',responsavel:'',data:today(),itens:[]};
    state.listaMaterial.unshift(l);save('listaMaterial');
    state.listaMaterialAtual=l;state.view='listaMaterialDetalhe';render();
  },
  abrirListaMaterial(id){
    const l=state.listaMaterial.find(x=>x.id===id);if(!l)return;
    state.listaMaterialAtual=l;state.view='listaMaterialDetalhe';render();
  },
  excluirListaMaterial(id){
    
    state.listaMaterial=state.listaMaterial.filter(x=>x.id!==id);save('listaMaterial');
    if(state.listaMaterialAtual?.id===id){state.listaMaterialAtual=null;state.view='listaMaterial';}render();
  },
  listaMaterialCampo(campo,val){if(!state.listaMaterialAtual)return;state.listaMaterialAtual[campo]=val;save('listaMaterial');},
  adicionarItemLista(){
    const l=state.listaMaterialAtual;if(!l)return;
    const desc=document.getElementById('novo-item-desc')?.value?.trim()||'';
    const qtd=document.getElementById('novo-item-qtd')?.value?.trim()||'';
    const un=document.getElementById('novo-item-un')?.value||'un';
    const obs=document.getElementById('novo-item-obs')?.value?.trim()||'';
    if(!desc){showToast('Informe a descrição','erro');return;}
    l.itens.push({desc,qtd,un,obs});save('listaMaterial');render();
  },
  itemListaCampo(idx,campo,val){
    const l=state.listaMaterialAtual;if(!l||!l.itens[idx])return;
    l.itens[idx][campo]=val;save('listaMaterial');
  },
  excluirItemLista(idx){
    const l=state.listaMaterialAtual;if(!l)return;
    l.itens.splice(idx,1);save('listaMaterial');render();
  },
  imprimirListaMaterial(){state.view='listaMaterialPDF';render();setTimeout(()=>window.print(),400);},
  async compartilharListaMaterial(){
    const l=state.listaMaterialAtual;if(!l)return;
    const linhas=['*LISTA DE MATERIAL*',l.nome||'',l.obra?'Obra: '+l.obra:'',fmtData(l.data),''];
    l.itens.forEach(i=>linhas.push(`${i.qtd} ${i.un} — ${i.desc}${i.obs?' ('+i.obs+')':''}`));
    const txt=linhas.filter(Boolean).join('\n');
    try{if(navigator.share)await navigator.share({text:txt});
      else{await navigator.clipboard.writeText(txt);showToast('Copiado!','sucesso');}}catch(e){}
  },

    if(tb)tb.innerHTML=renderAmbienteTotal(state.medicaoCeramicaAmb);
  },
  excluirSuperficieCeramica(tipo,supId){
    if(!state.medicaoCeramicaAmb)return;
    if(tipo==='piso')state.medicaoCeramicaAmb.pisos=state.medicaoCeramicaAmb.pisos.filter(s=>s.id!==supId);
    else state.medicaoCeramicaAmb.revestimentos=state.medicaoCeramicaAmb.revestimentos.filter(s=>s.id!==supId);
    save('medicaoCeramica');render();
  },
  addDescontoCeramica(tipo,supId){
    if(!state.medicaoCeramicaAmb)return;
    const lista=tipo==='piso'?state.medicaoCeramicaAmb.pisos:state.medicaoCeramicaAmb.revestimentos;
    const s=lista.find(x=>x.id===supId);
    if(s){s.descontos.push({id:'d'+Date.now(),larg:'',alt:''});save('medicaoCeramica');render();}
  },
  removerDescontoCeramica(tipo,supId,descId){
    if(!state.medicaoCeramicaAmb)return;
    const lista=tipo==='piso'?state.medicaoCeramicaAmb.pisos:state.medicaoCeramicaAmb.revestimentos;
    const s=lista.find(x=>x.id===supId);
    if(s){s.descontos=s.descontos.filter(x=>x.id!==descId);save('medicaoCeramica');render();}
  },
  descontoCeramicaCampo(tipo,supId,descId,campo,val){
    if(!state.medicaoCeramicaAmb)return;
    const lista=tipo==='piso'?state.medicaoCeramicaAmb.pisos:state.medicaoCeramicaAmb.revestimentos;
    const s=lista.find(x=>x.id===supId);
    const d=s?.descontos?.find(x=>x.id===descId);
    if(d){d[campo]=val;save('medicaoCeramica');
      const b=document.getElementById('cer-total-'+supId);if(b)b.innerHTML=renderSuperficieTotal(s);}
  },
  voltarMedicaoCeramicaDetalhe(){state.view='medicaoCeramicaDetalhe';state.medicaoCeramicaAmb=null;render();},
  async compartilharMedicaoCeramica(){
    const m=state.medicaoCeramicaAtual;if(!m)return;
    const txt=montarTextoMedicaoCeramica(m);
    try{if(navigator.share)await navigator.share({text:txt});
      else{await navigator.clipboard.writeText(txt);showToast('Copiado!','sucesso');}}catch(e){}
  },
  imprimirMedicaoCeramica(){state.view='medicaoCeramicaPDF';render();setTimeout(()=>window.print(),400);},

  muroForm(campo,val){
    state.muro[campo]=val; save('muro');
    // Selects mudam a UI → render completo; campos de texto → atualiza só resultado
    if(['fck','s1','s3','categoria','classe'].includes(campo)){ render(); return; }
    const b=document.getElementById('muro-resultado');
    if(b)b.innerHTML=renderMuroResultado(state.muro); else render();
  },
  abrirDocMuro(){},
  async compartilharMuro(){
    const r=calcularMuro(state.muro);const txt=montarTextoMuro(r);
    try{if(navigator.share)await navigator.share({text:txt});
      else{await navigator.clipboard.writeText(txt);showToast('Copiado!','sucesso');}}catch(e){}
  },

  configForm(campo,val){state.empresa[campo]=val;save('empresa');},
};

function render(){document.getElementById('root').innerHTML=getView();}
function getView(){
  switch(state.view){
    case 'home':return renderHome();
    case 'configuracoes':return renderConfiguracoes();
    case 'alvenaria':return renderAlvenaria();
    case 'alvenariaDetalhe':return renderAlvenariaDetalhe();
    case 'alvenariaAmbiente':return renderAlvenariaAmbiente();
    case 'alvenariaPDF':return renderAlvenariaPDF();
    case 'telhado':return renderTelhado();
    case 'drywall':return renderDrywall();
    case 'drywallDetalhe':return renderDrywallDetalhe();
    case 'drywallAmbiente':return renderDrywallAmbiente();
    case 'drywallPDF':return renderDrywallPDF();
    case 'medicaoCeramica':return renderMedicaoCeramica();
    case 'medicaoCeramicaDetalhe':return renderMedicaoCeramicaDetalhe();
    case 'medicaoCeramicaAmbiente':return renderMedicaoCeramicaAmbiente();
    case 'medicaoCeramicaPDF':return renderMedicaoCeramicaPDF();
    case 'concreto':return renderConcreto();
    case 'concretoDoc':return renderConcretoDoc();
    case 'listaMaterial':return renderListaMaterial();
    case 'listaMaterialDetalhe':return renderListaMaterialDetalhe();
    case 'listaMaterialPDF':return renderListaMaterialPDF();
    case 'diario':return renderDiario();
    case 'diarioObra':return renderDiarioObra();
    case 'diarioRegistro':return renderDiarioRegistro();
    case 'diarioPDF':return renderDiarioPDF();
    case 'privacidade':return renderPrivacidade();
    case 'termos':return renderTermos();
    case 'muro':return renderMuro();
    default:return renderHome();
  }
}
render();

// Registro do Service Worker (PWA offline)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('[CalcNBR] SW registrado:', reg.scope))
      .catch(err => console.warn('[CalcNBR] SW falhou:', err));
  });
}
</script>

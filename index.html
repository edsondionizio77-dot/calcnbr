<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CalcNBR — Calculadoras Técnicas</title>
  <meta name="theme-color" content="#1a5c38">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CalcNBR">
  <style>
    :root{--primary:#1a5c38;--primary-dark:#0f3d24;--accent:#4caf7d;--bg:#fff;
      --bg-soft:#f0f7f3;--border:#c8e6d4;--text:#1a2e22;--muted:#5a7a66;
      --danger:#c0392b;--success:#27ae60;--warning:#e67e22;
      --card-shadow:0 2px 8px rgba(26,92,56,.10);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
    #app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px;}
    .nav{background:var(--primary);color:white;padding:0 16px;display:flex;
      align-items:center;gap:10px;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);}
    .nav-logo{font-size:20px;font-weight:800;letter-spacing:-.5px;flex:1;}
    .nav-logo span{color:var(--accent);}
    .nav-badge{background:var(--accent);color:var(--primary-dark);font-size:9px;font-weight:800;padding:2px 6px;border-radius:10px;}
    .nav-cfg{background:none;border:none;color:rgba(255,255,255,.8);cursor:pointer;padding:4px;font-size:18px;}
    .stack{display:flex;flex-direction:column;gap:12px;padding:16px;}
    .row{display:flex;gap:8px;align-items:center;}
    .row-between{display:flex;justify-content:space-between;align-items:center;}
    .flex-wrap{flex-wrap:wrap;}
    .card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--card-shadow);}
    .card-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
    .empty{text-align:center;padding:40px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px;}
    .empty-msg{font-size:14px;}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;}
    .btn-primary{background:var(--primary);color:white;}
    .btn-primary:active{background:var(--primary-dark);}
    .btn-secondary{background:var(--bg-soft);color:var(--primary);border:1px solid var(--border);}
    .btn-ghost{background:none;border:none;color:var(--muted);padding:8px;}
    .btn-sm{padding:6px 12px;font-size:13px;}
    .back-btn{background:none;border:none;color:var(--primary);font-size:14px;cursor:pointer;display:flex;align-items:center;gap:4px;font-weight:600;}
    .form-group{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
    .form-group label{font-size:12px;font-weight:600;color:var(--muted);}
    input[type="text"],input[type="number"],select,textarea{width:100%;padding:10px 12px;
      border:1.5px solid var(--border);border-radius:8px;font-size:15px;background:var(--bg);
      color:var(--text);-webkit-appearance:none;}
    input:focus,select:focus{outline:none;border-color:var(--primary);}
    .mode-row{display:flex;gap:6px;margin-bottom:12px;}
    .mode-btn{flex:1;padding:8px 6px;border:1.5px solid var(--border);border-radius:8px;
      background:var(--bg);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center;}
    .mode-btn.active{background:var(--primary);color:white;border-color:var(--primary);}
    .home-acesso-icone{width:44px;height:44px;border-radius:10px;background:var(--bg-soft);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .home-acesso-icone svg{width:22px;height:22px;color:var(--primary);}
    .home-acesso-icone-verde{background:#e8f5e9;}
    #toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a2e22;
      color:white;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;
      display:none;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.3);}
    @media print{.no-print{display:none !important;}#app{max-width:100%;padding:0;}.nav{display:none;}}
    .recibo-page{background:white;}
    .recibo-header{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;
      padding-bottom:16px;border-bottom:2px solid var(--primary);}
    .recibo-empresa{flex:1;text-align:right;}
    .recibo-empresa-nome{font-size:16px;font-weight:800;color:var(--primary);}
    .recibo-empresa-dados{font-size:11px;color:var(--muted);margin-top:2px;}
    .recibo-titulo{text-align:center;margin-bottom:20px;}
    .recibo-titulo h1{font-size:18px;font-weight:800;color:var(--primary);}
    .recibo-corpo{font-size:13px;}
    .print-page{padding:16px;}
  </style>
</head>
<body>
<div id="app">
  <nav class="nav no-print">
    <div class="nav-logo">Calc<span>NBR</span></div>
    <span class="nav-badge">NBR</span>
    <button class="nav-cfg" onclick="actions.irConfiguracoes()">⚙</button>
  </nav>
  <div id="root"></div>
  <div id="toast"></div>
</div>

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const fmtBRL = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

const fmtData = (d) => { if (!d) return ''; const [y, m, day] = d.split('-'); return `${day}/${m}/${y}`; };

const AC_FATORES = { 'AC1': 5.5, 'AC2': 5.5, 'AC3': 5.5 }; // 5,5 kg/m² (saco 20kg rende ~3,5-4,0 m² em obra)

  '120x180': { nome: '1,20 × 1,80 m', larg: 1.20, alt: 1.80, area: 2.16 },

  '60x120':  { nome: '0,60 × 1,20 m', larg: 0.60, alt: 1.20, area: 0.72 },
};


function fmtDec(n, casas = 2) {
  return (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
}

function fmtDataCurta(iso) {
  try { const [y, m, d] = iso.split('-'); return `${d}/${m}`; } catch (e) { return iso; }
}

function fmtDataExtenso(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(n => parseInt(n, 10));
  const meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
                 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  if (!y || !m || !d) return iso;
  return `${d} de ${meses[m - 1]} de ${y}`;
}

function persist(k, v) {
  state[k] = v;
  STORE.set('ei_' + k, v);
  if (['laudos','orcamentos','diasTrabalhados','colaboradores','entradas','despesas','adiantamentos','etapasObra'].includes(k)) agendarBackupLocal();
}

function showToast(msg, type = 'success') {
  state.toast = { msg, type };
  render();
  setTimeout(() => { if (state.toast && state.toast.msg === msg) { state.toast = null; render(); } }, 2500);
}

// === ALVENARIA ===
// ==================== ALVENARIA E REVESTIMENTO ====================
// Dimensões em metros (comprimento × altura × espessura)
const BLOCOS_ALV = {
  'ceramico_9':    { nome: 'Cerâmico vedação 9×19×19',    c:0.19, a:0.19, e:0.09,  tipo:'vedação',   temCanaleta:false },
  'ceramico_115':  { nome: 'Cerâmico vedação 11,5×19×19', c:0.19, a:0.19, e:0.115, tipo:'vedação',   temCanaleta:false },
  'ceramico_14':   { nome: 'Cerâmico vedação 14×19×29',   c:0.29, a:0.19, e:0.14,  tipo:'vedação',   temCanaleta:true  },
  'estrutural_14': { nome: 'Cerâmico estrutural 14×19×29', c:0.29, a:0.19, e:0.14, tipo:'estrutural', temCanaleta:true  },
  'concreto_14':   { nome: 'Concreto 14×19×39',           c:0.39, a:0.19, e:0.14,  tipo:'vedação',   temCanaleta:true  },
  'concreto_19':   { nome: 'Concreto estrutural 19×19×39', c:0.39, a:0.19, e:0.19, tipo:'estrutural', temCanaleta:true  },
};

// Blocos por m² considerando a junta (módulo = bloco + junta nas duas direções)
function blocosPorM2Alv(bloco, junta) {
  const areaModulo = (bloco.c + junta) * (bloco.a + junta);
  return areaModulo > 0 ? 1 / areaModulo : 0;
}

// Converte volume de argamassa PRONTA em sacos de cimento (50 kg) + m³ de areia.
// traço 1:tracoAreia (cimento:areia) em volume. Os materiais secos rendem menos
// argamassa que a soma dos volumes (fator ~0,75). Saco 50 kg ≈ 0,0347 m³.
function argamassaTraco(volumePronta, tracoAreia) {
  const volMateriais = volumePronta / 0.75;   // volume seco necessário
  const partes = 1 + tracoAreia;
  const volCimento = volMateriais / partes;
  const volAreia = volMateriais * tracoAreia / partes;
  return {
    sacosCimento: Math.ceil(volCimento / 0.0347),
    volAreia: volAreia,
    volCimento
  };
}

function calcAlvenaria(d) {
  const bloco = BLOCOS_ALV[d.bloco] || BLOCOS_ALV['ceramico_9'];
  const junta = nnum(d.junta) || 0.012;

  let areaBruta = d.modo === 'direta'
    ? nnum(d.areaDireta)
    : nnum(d.comprimento) * nnum(d.altura);

  let areaPilares = 0;
  (d.pilares || []).forEach(p => { areaPilares += nnum(p.larg) * nnum(p.alt) * (nnum(p.qtd) || 1); });
  let areaVaos = 0;
  (d.vaos || []).forEach(v => { areaVaos += nnum(v.larg) * nnum(v.alt) * (nnum(v.qtd) || 1); });

  const areaLiquida = Math.max(0, areaBruta - areaPilares - areaVaos);
  const bpm2 = blocosPorM2Alv(bloco, junta);
  const perda = nnum(d.perda) || 5;
  const qtdBlocos = Math.ceil(areaLiquida * bpm2 * (1 + perda / 100));

  const fatorArg = nnum(d.fatorArg) || 0.02;
  const volArg = consumoArgM2(bloco, fatorArg) * areaLiquida * (1 + perda / 100);
  const tracoAssent = nnum(d.tracoAssent) || 5;
  const arg = argamassaTraco(volArg, tracoAssent);

  // Canaleta (por metro linear)
  const metrosCanaleta = nnum(d.metrosCanaleta);
  const canaletasPorM = bloco.c > 0 ? 1 / bloco.c : 0;
  const qtdCanaletas = metrosCanaleta > 0
    ? Math.ceil(metrosCanaleta * canaletasPorM * (1 + perda / 100)) : 0;

  return {
    bloco, junta, areaBruta, areaPilares, areaVaos, areaLiquida, bpm2, qtdBlocos, perda,
    volArg, tracoAssent, ...arg,
    metrosCanaleta, canaletasPorM, qtdCanaletas
  };
}

// === ALVENARIA POR SUPERFÍCIE (espelha drywall/revestimento) ===
// Cada parede é independente, com bloco próprio, medidas e descontos.
function calcSuperficieAlvenaria(s) {
  if (!s || !s.ativa) return { area:0, areaLiquida:0, qtdBlocos:0, sacosCimento:0, volAreia:0, qtdCanaletas:0 };
  const bloco = BLOCOS_ALV[s.bloco] || BLOCOS_ALV['ceramico_9'];
  const junta = nnum(s.junta) || 0.012;
  const areaBruta = s.modo === 'direta' ? nnum(s.areaDireta) : nnum(s.larg) * nnum(s.altura);
  const areaDesc = (s.descontos||[]).reduce((a,d)=>a + nnum(d.larg)*nnum(d.alt)*(nnum(d.qtd)||1), 0);
  const areaPilares = (s.pilares||[]).reduce((a,p)=>a + nnum(p.larg)*nnum(p.alt)*(nnum(p.qtd)||1), 0);
  const areaLiquida = Math.max(0, areaBruta - areaDesc - areaPilares);
  const perda = nnum(s.perda) || 5;
  const bpm2 = blocosPorM2Alv(bloco, junta);
  const qtdBlocos = Math.ceil(areaLiquida * bpm2 * (1 + perda/100));
  const fatorArg = nnum(s.fatorArg) || 0.02;
  const volArg = consumoArgM2(bloco, fatorArg) * areaLiquida * (1 + perda/100);
  const tracoAssent = nnum(s.tracoAssent) || 5;
  const arg = argamassaTraco(volArg, tracoAssent);
  // Canaleta pela quantidade de fiadas de amarração (opcional, por ML)
  const metrosCanaleta = nnum(s.metrosCanaleta);
  const canaletasPorM = bloco.c > 0 ? 1/bloco.c : 0;
  const qtdCanaletas = (metrosCanaleta > 0 && bloco.temCanaleta)
    ? Math.ceil(metrosCanaleta * canaletasPorM * (1 + perda/100)) : 0;
  return { bloco, area:areaBruta, areaLiquida, qtdBlocos, volArg, ...arg, qtdCanaletas, perda };
}

function calcListaAlvenaria(lista) {
  return (lista||[]).filter(s=>s.ativa).reduce((t,s)=>{
    const r = calcSuperficieAlvenaria(s);
    return {
      area: t.area + r.areaLiquida,
      qtdBlocos: t.qtdBlocos + r.qtdBlocos,
      sacosCimento: t.sacosCimento + r.sacosCimento,
      volAreia: t.volAreia + r.volAreia,
      qtdCanaletas: t.qtdCanaletas + r.qtdCanaletas,
    };
  }, { area:0, qtdBlocos:0, sacosCimento:0, volAreia:0, qtdCanaletas:0 });
}

function calcAmbienteAlvenaria(amb) {
  return calcListaAlvenaria(amb.paredes);
}

function calcMedicaoAlvenaria(ambientes) {
  return (ambientes||[]).reduce((t,amb)=>{
    const r = calcListaAlvenaria(amb.paredes);
    return {
      area: t.area + r.area,
      qtdBlocos: t.qtdBlocos + r.qtdBlocos,
      sacosCimento: t.sacosCimento + r.sacosCimento,
      volAreia: t.volAreia + r.volAreia,
      qtdCanaletas: t.qtdCanaletas + r.qtdCanaletas,
    };
  }, { area:0, qtdBlocos:0, sacosCimento:0, volAreia:0, qtdCanaletas:0 });
}

// Agrupa compras por tipo de bloco (para o vendedor separar)
function agruparComprasAlvenaria(ambientes) {
  const blocos = {}; let sacosCimento=0, volAreia=0, canaletas=0;
  (ambientes||[]).forEach(amb=>{
    (amb.paredes||[]).filter(s=>s.ativa).forEach(s=>{
      const r = calcSuperficieAlvenaria(s);
      const nome = (BLOCOS_ALV[s.bloco]||{}).nome || s.bloco;
      blocos[nome] = (blocos[nome]||0) + r.qtdBlocos;
      sacosCimento += r.sacosCimento;
      volAreia += r.volAreia;
      canaletas += r.qtdCanaletas;
    });
  });
  return { blocos, sacosCimento:Math.ceil(sacosCimento), volAreia, canaletas:Math.ceil(canaletas) };
}

function novaSuperficieAlvenaria() {
  return {
    id:'as_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    nome:'', ativa:true, bloco:'ceramico_14', modo:'projecao',
    larg:'', altura:'', areaDireta:'', junta:'', perda:5,
    fatorArg:'', tracoAssent:5, metrosCanaleta:'',
    pilares:[], descontos:[]
  };
}

function calcRevestimento(d) {
  const areaBase = d.modoRev==='direta'
    ? nnum(d.areaRev)
    : nnum(d.compRev) * nnum(d.altRev);
  const area = d.ambosLados ? areaBase * 2 : areaBase;
  const defs = [
    { key:'chapisco', nome:'Chapisco', esp:(nnum(d.espchapisco)||5)/1000,  traco:nnum(d.tracochapisco)||3, usar:d.usarchapisco !== false },
    { key:'emboco',   nome:'Emboço',   esp:(nnum(d.espemboco)||20)/1000,   traco:nnum(d.tracoemboco)||6,  usar:d.usaremboco !== false },
    { key:'reboco',   nome:'Reboco',   esp:(nnum(d.espreboco)||5)/1000,    traco:nnum(d.tracoreboco)||5,  usar:d.usarreboco !== false },
  ];
  const perda = nnum(d.perdaRev) || 10;
  const camadas = [];
  defs.forEach(c => {
    if (!c.usar) return;
    const vol = area * c.esp * (1 + perda / 100);
    camadas.push({ ...c, vol, ...argamassaTraco(vol, c.traco) });
  });
  return { area, areaBase, ambosLados:!!d.ambosLados, camadas, perda };
}

function calcContrapiso(d) {
  const area = d.modoCp==='direta'
    ? nnum(d.areaCp)
    : nnum(d.compCp) * nnum(d.largCp);
  const esp = (nnum(d.espCp) || 30) / 1000;
  const traco = nnum(d.tracoCp) || 4;
  const perda = nnum(d.perdaCp) || 5;
  const vol = area * esp * (1 + perda / 100);
  return { area, esp, traco, vol, perda, ...argamassaTraco(vol, traco) };
}

// Volume de argamassa de assentamento por m² de parede.
// Fonte: a bibliografia diverge muito (SINAPI 0,01 teórico vs prática 0,05),
// pois o consumo real varia com furos do bloco, junta vertical, perda e mão de
// obra. Por isso adotamos um fator editável por m², escalonado pela espessura
// do bloco (junta vertical mais profunda em bloco mais largo), que o usuário
// calibra com a própria obra. Ponto de partida: 0,02 m³/m² para bloco de 9 cm.
function consumoArgM2(bloco, fatorBase) {
  const base = fatorBase > 0 ? fatorBase : 0.02;
  // escalona pela espessura relativa ao bloco de referência (9 cm)
  return base * (bloco.e / 0.09);
}

// Recobrimento longitudinal conforme a inclinação (manual Eternit):
// 18% a 27% → 20 cm · acima de 27% → 14 cm
function recobrimentoFibro(inclPct) {
  return nnum(inclPct) < 27 ? 0.20 : 0.14;
}
// Nº de apoios da telha conforme o comprimento (vão livre máx. 1,69 m)
function apoiosFibro(comprimento) {
  return nnum(comprimento) <= 1.83 ? 2 : 3;
}

// Comprimentos comerciais da fibrocimento (m)
const COMPRIMENTOS_FIBRO = [1.22, 1.53, 1.83, 2.13, 2.44];

// Fator de inclinação: converte área projetada em área real do plano.
function fatorInclinacao(iPct) {
  const ang = Math.atan(nnum(iPct) / 100);
  return 1 / Math.cos(ang);
}

// Rendimento da telha de fibrocimento conforme o comprimento escolhido.
function areaUtilFibro(comprimento, t) {
  return (nnum(comprimento) - t.recobLong) * t.larguraUtil;
}

function calcularTelhado(td) {
  const t = TIPOS_TELHA[td.tipo] || TIPOS_TELHA['colonial'];
  const incl = nnum(td.inclinacao);
  const fator = fatorInclinacao(incl);
  const ehFibro = td.tipo === 'eternit4' || td.tipo === 'eternit5';
  const ehPvc = td.tipo === 'pvc';

  // --- Geometria ---
  // Dimensões da projeção; para telhado de 2 águas a projeção é dividida.
  const nAguas = nnum(td.nAguas) || 2;
  let compProj = 0, largProj = 0, areaProjetada = 0, areaReal = 0;
  if (td.modo === 'direta') {
    areaReal = nnum(td.areaDireta);
    areaProjetada = areaReal / fator;
    // estima dimensões quadradas para o madeiramento
    compProj = Math.sqrt(areaProjetada);
    largProj = compProj;
  } else {
    compProj = nnum(td.comprimento);
    largProj = nnum(td.largura);
    areaProjetada = compProj * largProj;
    areaReal = areaProjetada * fator;
  }

  const perdaPct = nnum(td.perda);
  const areaComPerda = areaReal * (1 + perdaPct / 100);

  // --- Telhas ---
  let telhasM2 = 0, qtdTelhas = 0, pesoTotal = 0, compFibro = null;
  let areaUtil = 0, recobLong = 0, nApoios = 0;
  if (ehFibro) {
    compFibro = nnum(td.compFibro) || 2.44;
    recobLong = recobrimentoFibro(incl);
    areaUtil = (compFibro - recobLong) * t.larguraUtil;
    telhasM2 = areaUtil > 0 ? 1 / areaUtil : 0;
    qtdTelhas = Math.ceil(areaComPerda * telhasM2);
    nApoios = apoiosFibro(compFibro);
    const pesoUn = (t.pesosNominais && t.pesosNominais[compFibro]) || 0;
    pesoTotal = qtdTelhas * pesoUn;
  } else if (ehPvc) {
    // PVC: área útil tabelada pelo fabricante (já considera os recobrimentos)
    compFibro = nnum(td.compFibro) || 2.42;
    areaUtil = (t.areaUtilTabela && t.areaUtilTabela[compFibro]) || ((compFibro - 0.10) * t.larguraUtil);
    telhasM2 = areaUtil > 0 ? 1 / areaUtil : 0;
    qtdTelhas = Math.ceil(areaComPerda * telhasM2);
    // Apoios por telha = terças que a atravessam. Usa o comprimento útil
    // longitudinal (área útil ÷ largura útil), que já desconta as sobreposições.
    // Ex.: telha 2,42 m → 1,72/0,80 = 2,15 m útil → round(2,15/0,66)=3 vãos → 4 terças.
    const espPvc = nnum(td.espTerca) || t.espTerca;
    const utilLong = areaUtil / t.larguraUtil;
    nApoios = espPvc > 0 ? Math.max(2, Math.round(utilLong / espPvc) + 1) : 4;
    pesoTotal = qtdTelhas * ((t.pesosNominais && t.pesosNominais[compFibro]) || 0);
  } else {
    telhasM2 = td.tipo === 'personalizada' ? nnum(td.telhasM2Custom) : t.telhasM2;
    qtdTelhas = Math.ceil(areaComPerda * telhasM2);
    pesoTotal = qtdTelhas * (t.pesoTelha || 0);
  }

  // --- Madeiramento (por PEÇAS, não por área/espaçamento) ---
  // Comprimento da água (no plano inclinado) e largura da fachada.
  const compAgua = (largProj / nAguas) * fator;   // do beiral à cumeeira (real)
  const projAgua = largProj / nAguas;              // mesma extensão em planta
  const largFachada = compProj;                    // comprimento das terças
  const madeira = {};

  // Nº de peças: a prática de obra DILUI a sobra nos vãos existentes em vez
  // de acrescentar uma peça. Se sobram 30 cm, os vãos ficam pouco menores —
  // nunca se coloca uma peça extra só para a sobra. Daí o arredondamento
  // normal (round) e não para cima.
  // modo 'max': o espaçamento é um limite superior (vão livre de terça) —
  //   a sobra é diluída, podendo reduzir o vão. Arredonda normal.
  // modo 'min': o espaçamento é um mínimo de encaixe (galgo da ripa) —
  //   o vão real nunca pode ultrapassá-lo. Arredonda para cima.
  const contarPecas = (extensao, espacamento, modo = 'max') => {
    if (!(espacamento > 0)) return 0;
    const vaos = modo === 'min'
      ? Math.ceil(extensao / espacamento)
      : Math.round(extensao / espacamento);
    return Math.max(2, vaos + 1);
  };
  // Vão real após a diluição — usado para alertar se ultrapassa o máximo.
  const vaoReal = (extensao, espacamento, modo = 'max') => {
    const n = contarPecas(extensao, espacamento, modo) - 1;
    return n > 0 ? extensao / n : 0;
  };
  // Peças horizontais (terça e ripa) que caem na cumeeira são COMPARTILHADAS
  // pelas águas opostas — contar uma única vez. Telhado de 2 águas tem 1 cumeeira;
  // de 4 águas, a cumeeira principal também é única.
  const cumeeiraCompartilhada = nAguas >= 2 ? 1 : 0;

  if (t.usaRipa) {
    const espRipa = nnum(td.espRipa) || t.espRipa;
    const espCaibro = nnum(td.espCaibro) || t.espCaibro;
    const espTerca = nnum(td.espTerca) || t.espTerca;
    // Ripas: horizontais, ao longo da água; cada uma tem a largura da fachada
    madeira.nRipas = contarPecas(projAgua, espRipa, 'min') * nAguas - cumeeiraCompartilhada;
    madeira.ripaM = madeira.nRipas * largFachada;
    // Caibros: no sentido da inclinação — cada água tem os seus, não compartilham
    madeira.nCaibros = contarPecas(largFachada, espCaibro) * nAguas;
    madeira.caibroM = madeira.nCaibros * compAgua;
    // Terças: horizontais; a da cumeeira serve as duas águas
    madeira.nTercas = contarPecas(projAgua, espTerca) * nAguas - cumeeiraCompartilhada;
    madeira.tercaM = madeira.nTercas * largFachada;
    madeira.espRipa = espRipa; madeira.espCaibro = espCaibro; madeira.espTerca = espTerca;
  } else {
    const espTerca = nnum(td.espTerca) || t.espTerca;
    madeira.nTercas = contarPecas(projAgua, espTerca) * nAguas - cumeeiraCompartilhada;
    madeira.tercaM = madeira.nTercas * largFachada;
    madeira.espTerca = espTerca;
  }
  madeira.compAgua = compAgua;
  madeira.projAgua = projAgua;
  // vão real das terças após a diluição da sobra
  madeira.vaoRealTerca = vaoReal(projAgua, madeira.espTerca);
  if (madeira.espRipa) madeira.vaoRealRipa = vaoReal(projAgua, madeira.espRipa, 'min');
  madeira.largFachada = largFachada;

  // --- Acessórios ---
  const compCumeeira = nnum(td.cumeeira);
  let cumeeiras = 0;
  if (compCumeeira > 0) {
    cumeeiras = (ehFibro || ehPvc)
      ? Math.ceil(compCumeeira / (ehPvc ? 0.76 : 0.90))
      : Math.ceil(compCumeeira * 3);
  }
  // Parafusos: 2 pontos por apoio (2ª e 5ª crista) × nº de apoios
  // Fixações: 2 pontos por apoio (2ª e 5ª onda). O apoio do topo é
  // COMPARTILHADO com a telha da fileira de cima (a sobreposição usa o
  // mesmo furo), por isso conta-se um apoio a menos por telha.
  let parafusos = 0;
  const apoiosEfetivos = Math.max(1, nApoios - 1);
  if (ehFibro || ehPvc) parafusos = qtdTelhas * apoiosEfetivos * 2;
  const tipoFixacao = (t.fixacao === 'prego') ? 'Prego telheiro 18×27 + arruela'
                    : (ehPvc ? 'Parafuso + kit de vedação' : 'Parafuso 8 mm + conjunto de vedação');

  // --- Impermeabilização (telhas CRFS sem amianto) ---
  let impermeabilizacao = null;
  if (t.impermeabilizar && td.impermeabilizar !== false) {
    const prod = PRODUTOS_IMPERM[td.produtoImperm] || PRODUTOS_IMPERM['vedbem'];
    const demaos = nnum(td.demaos) || prod.demaos;
    const faces = td.pintarAmbasFaces === true ? 2 : 1;
    // Rendimento por lata: usa o do fabricante por padrão; o usuário pode ajustar
    const rendLata = nnum(td.rendimentoLata) || prod.rendLata;
    const rendimento = rendLata / prod.volumeLata;   // m²/L por demão
    const areaAplicar = areaReal * faces;
    const latas = (areaAplicar * demaos) / rendLata;
    const litros = latas * prod.volumeLata;
    impermeabilizacao = {
      produto: prod, litros, demaos, faces, rendimento, rendLata,
      areaAplicar,
      latasExato: latas,
      latas: Math.ceil(latas),
      volumeLata: prod.volumeLata
    };
  }

  // --- Verificações ---
  const alertas = [];
  if (incl > 0 && t.inclinacaoMin > 0 && incl < t.inclinacaoMin) {
    alertas.push({ tipo: 'erro', txt: `Inclinação de ${fmtDec(incl, 1)}% é inferior à mínima de ${t.inclinacaoMin}% recomendada pelo fabricante para ${t.nome}. Risco de infiltração por refluxo de água.` });
  }
  if (incl <= 0) {
    alertas.push({ tipo: 'aviso', txt: 'Informe a inclinação do telhado para o cálculo da área real.' });
  }
  if (ehFibro && t.vaoMax && madeira.vaoRealTerca > t.vaoMax + 0.005) {
    alertas.push({ tipo: 'erro', txt: `Após distribuir as terças, o vão real fica em ${fmtDec(madeira.vaoRealTerca, 2)} m — acima do vão livre máximo de ${fmtDec(t.vaoMax, 2)} m do fabricante. Reduza o espaçamento.` });
  }
  if (ehFibro && nApoios === 3) {
    alertas.push({ tipo: 'aviso', txt: `Telha de ${fmtDec(compFibro, 2)} m exige apoio intermediário (3 apoios), com fixação também no apoio do meio.` });
  }
  if (td.tipo === 'personalizada' && !(nnum(td.telhasM2Custom) > 0)) {
    alertas.push({ tipo: 'aviso', txt: 'Informe quantas telhas por m² para a telha personalizada.' });
  }

  return {
    tipo: t, tipoKey: td.tipo, ehFibro, ehPvc,
    incl, fator, areaProjetada, areaReal, areaComPerda, perdaPct, nAguas,
    telhasM2, qtdTelhas, pesoTotal, compFibro, areaUtil, recobLong, nApoios,
    madeira, cumeeiras, compCumeeira, parafusos, tipoFixacao, apoiosEfetivos, impermeabilizacao,
    alertas, usaRipa: t.usaRipa
  };
}

// Parâmetros meteorológicos do S2 — NBR 6123, Tabela 21 (b, Fr, p)
const S2_PARAMS = {
  'I':   { A: [1.10, 1.00, 0.06],  B: [1.11, 0.98, 0.065], C: [1.12, 0.95, 0.070] },
  'II':  { A: [1.00, 1.00, 0.085], B: [1.00, 0.98, 0.090], C: [1.00, 0.95, 0.100] },
  'III': { A: [0.94, 1.00, 0.100], B: [0.94, 0.98, 0.105], C: [0.93, 0.95, 0.115] },
  'IV':  { A: [0.86, 1.00, 0.120], B: [0.85, 0.98, 0.125], C: [0.84, 0.95, 0.135] },
  'V':   { A: [0.74, 1.00, 0.150], B: [0.73, 0.98, 0.160], C: [0.71, 0.95, 0.175] }
};
const S2_CATEGORIAS = {
  'I':   'I — Superfície lisa, mar calmo, lago',
  'II':  'II — Campo aberto, poucos obstáculos',
  'III': 'III — Subúrbio, casas baixas, muros',
  'IV':  'IV — Cidade densa, casas agrupadas',
  'V':   'V — Centro com prédios altos'
};
const S3_TIPOS = {
  '1.10': 'Edificação crítica (hospital, quartel)',
  '1.00': 'Edificação normal (residência, comércio)',
  '0.95': 'Edificação com baixo fator de ocupação',
  '0.88': 'Vedações, muros e obras provisórias'
};

// S2 = b · Fr · (z/10)^p — NBR 6123 item 5.3
function calcS2(categoria, classe, z) {
  const p = (S2_PARAMS[categoria] || S2_PARAMS['III'])[classe || 'A'];
  const [b, fr, expo] = p;
  return b * fr * Math.pow(Math.max(z, 1) / 10, expo);
}

// Coeficiente de arrasto de muro isolado (placa ao nível do solo).
// NBR 6123 item 7.6: depende da relação comprimento/altura.
function calcCaMuro(comprimento, altura) {
  if (!(altura > 0)) return 1.2;
  const rel = comprimento / altura;
  if (rel <= 1) return 1.2;
  if (rel <= 2) return 1.25;
  if (rel <= 4) return 1.3;
  if (rel <= 10) return 1.4;
  if (rel <= 20) return 1.5;
  return 1.6;                     // muro muito longo em relação à altura
}

// Cálculo completo do muro.

// === DRYWALL (por superfície — espelha Revestimento) ===
// Base: NBR 15758:2025, manuais Placo/Knauf/Gypsum
// Cada superfície (parede ou forro) é independente e completa.

function calcSuperficieDrywall(s) {
  if (!s || !s.ativa) return { area:0, nPlacas:0, guiaBarras:0, montanteBarras:0, nMontantes:0,
    canaletaBarras:0, nTirantes:0, cantoneiraML:0, parafusosPlaca:0, parafusosMetal:0, fitaML:0, massaKg:0, laM2:0 };
  const tipo = s.tipoSuperficie || 'parede'; // 'parede' ou 'forro'
  const perda = nnum(s.perda) || 10;
  const placa = PLACAS_DRYWALL[s.placa] || PLACAS_DRYWALL['120x180'];
  const parafPorM2 = nnum(s.parafusoM2) || 25;
  const fitaFator = nnum(s.fitaFator) || 2;
  const massaFator = nnum(s.massaFator) || 0.5;

  if (tipo === 'forro') {
    const area = s.modo === 'direta' ? nnum(s.areaDireta) : nnum(s.larg) * nnum(s.comp);
    const perimetro = nnum(s.perimetro) || 0;
    const nPlacas = Math.ceil(area / placa.area * (1 + perda/100));
    const canaletaML = Math.ceil(area / 0.60 * (1 + perda/100));
    const canaletaBarras = Math.ceil(canaletaML / 3);
    const nTirantes = Math.ceil(area * 1.7);
    const cantoneiraML = perimetro > 0 ? Math.ceil(perimetro * (1 + perda/100)) : 0;
    const parafusos = Math.ceil(area * parafPorM2);
    const fitaML = Math.ceil(area * fitaFator);
    const massaKg = Math.ceil(area * massaFator);
    return { tipo:'forro', area, nPlacas, canaletaBarras, canaletaML, nTirantes, cantoneiraML,
      parafusosPlaca:parafusos, parafusosMetal:0, guiaBarras:0, montanteBarras:0, nMontantes:0,
      fitaML, massaKg, laM2:0, placa };
  }

  // PAREDE
  const altura = nnum(s.altura) || 2.80;
  const areaFaceBruta = s.modo === 'direta' ? nnum(s.areaDireta) : nnum(s.larg) * altura;
  const areaDesc = (s.descontos||[]).reduce((a,d) => a + nnum(d.larg)*nnum(d.alt), 0);
  const areaFace = Math.max(0, areaFaceBruta - areaDesc);
  const compEfetivo = s.modo === 'direta' && altura > 0 ? areaFace / altura : nnum(s.larg);
  const espMontante = nnum(s.espMontante) || (s.ambiente === 'umido' ? 0.40 : 0.60);
  const areaTotal = areaFace * 2; // duas faces
  const guiaML = compEfetivo * 2;
  const guiaBarras = Math.ceil(guiaML / 3 * (1 + perda/100));
  const nMontantes = Math.ceil(compEfetivo / espMontante) + 1;
  const montanteBarras = Math.ceil(nMontantes * Math.ceil(altura/3) * (1 + perda/100));
  const nPlacas = Math.ceil(areaTotal / placa.area * (1 + perda/100));
  const parafusosPlaca = Math.ceil(areaTotal * parafPorM2);
  const parafusosMetal = nMontantes * 4;
  const fitaML = Math.ceil(areaTotal * fitaFator);
  const massaKg = Math.ceil(areaTotal * massaFator);
  const laM2 = s.isolamento ? Math.ceil(areaFace * (1 + perda/100)) : 0;
  return { tipo:'parede', area:areaFace, areaTotal, nPlacas, guiaBarras, guiaML, nMontantes, montanteBarras,
    espMontante, parafusosPlaca, parafusosMetal, canaletaBarras:0, nTirantes:0, cantoneiraML:0,
    fitaML, massaKg, laM2, placa, altura };
}

function calcListaDrywall(lista) {
  return (lista||[]).filter(s=>s.ativa).reduce((t,s) => {
    const r = calcSuperficieDrywall(s);
    return {
      area: t.area + r.area,
      nPlacas: t.nPlacas + r.nPlacas,
      guiaBarras: t.guiaBarras + r.guiaBarras,
      montanteBarras: t.montanteBarras + r.montanteBarras,
      canaletaBarras: t.canaletaBarras + r.canaletaBarras,
      nTirantes: t.nTirantes + r.nTirantes,
      cantoneiraML: t.cantoneiraML + r.cantoneiraML,
      parafusosPlaca: t.parafusosPlaca + r.parafusosPlaca,
      parafusosMetal: t.parafusosMetal + r.parafusosMetal,
      fitaML: t.fitaML + r.fitaML,
      massaKg: t.massaKg + r.massaKg,
      laM2: t.laM2 + r.laM2,
    };
  }, { area:0,nPlacas:0,guiaBarras:0,montanteBarras:0,canaletaBarras:0,nTirantes:0,
       cantoneiraML:0,parafusosPlaca:0,parafusosMetal:0,fitaML:0,massaKg:0,laM2:0 });
}

function calcAmbienteDrywall(amb) {
  const paredes = calcListaDrywall(amb.paredes);
  const forros  = calcListaDrywall(amb.forros);
  return { paredes, forros,
    area: paredes.area + forros.area,
    nPlacas: paredes.nPlacas + forros.nPlacas,
    parafusos: paredes.parafusosPlaca + paredes.parafusosMetal + forros.parafusosPlaca };
}

function calcMedicaoDrywall(ambientes) {
  return (ambientes||[]).reduce((t,amb) => {
    const p = calcListaDrywall(amb.paredes);
    const f = calcListaDrywall(amb.forros);
    return {
      area: t.area + p.area + f.area,
      nPlacas: t.nPlacas + p.nPlacas + f.nPlacas,
      guiaBarras: t.guiaBarras + p.guiaBarras,
      montanteBarras: t.montanteBarras + p.montanteBarras,
      canaletaBarras: t.canaletaBarras + f.canaletaBarras,
      nTirantes: t.nTirantes + f.nTirantes,
      cantoneiraML: t.cantoneiraML + f.cantoneiraML,
      parafusosPlaca: t.parafusosPlaca + p.parafusosPlaca + f.parafusosPlaca,
      parafusosMetal: t.parafusosMetal + p.parafusosMetal,
      fitaML: t.fitaML + p.fitaML + f.fitaML,
      massaKg: t.massaKg + p.massaKg + f.massaKg,
      laM2: t.laM2 + p.laM2 + f.laM2,
    };
  }, { area:0,nPlacas:0,guiaBarras:0,montanteBarras:0,canaletaBarras:0,nTirantes:0,
       cantoneiraML:0,parafusosPlaca:0,parafusosMetal:0,fitaML:0,massaKg:0,laM2:0 });
}

// Agrupa as compras por ESPECIFICAÇÃO real da peça, para o vendedor separar certo.
// Ex: "Placa Drywall ST 1,20×1,80m", "Guia 70mm", "Montante 70mm".
function agruparComprasDrywall(ambientes) {
  const g = {};
  const add = (chave, nome, un, qtd, ordem) => {
    if (qtd <= 0) return;
    if (!g[chave]) g[chave] = { nome, un, qtd: 0, ordem };
    g[chave].qtd += qtd;
  };
  const labelPlaca = { ST:'ST (Standard)', RU:'RU (Umidade)', RF:'RF (Fogo)' };

  (ambientes||[]).forEach(amb => {
    (amb.paredes||[]).filter(s=>s.ativa).forEach(s => {
      const r = calcSuperficieDrywall(s);
      const placaNome = (PLACAS_DRYWALL[s.placa]||{}).nome || s.placa;
      const tp = labelPlaca[s.tipoPlaca] || s.tipoPlaca || 'ST';
      const perfil = s.perfil || '70';
      add(`placa_${s.tipoPlaca}_${s.placa}`, `Placa Drywall ${tp} · ${placaNome}`, 'un', r.nPlacas, 1);
      add(`guia_${perfil}`, `Guia ${perfil}mm (3,00 m)`, 'barras', r.guiaBarras, 2);
      add(`mont_${perfil}`, `Montante ${perfil}mm (3,00 m)`, 'barras', r.montanteBarras, 3);
      add('paraf_placa', 'GGP25 3,5×25mm (placa→metal)', 'un', r.parafusosPlaca, 8);
      add('paraf_metal', 'Parafuso Auto Brocante 4,2×13 (metal→metal)', 'un', r.parafusosMetal, 9);
      add('fita', 'Fita para juntas', 'm', r.fitaML, 10);
      add('massa', 'Massa para juntas', 'kg', r.massaKg, 11);
      if (r.laM2 > 0) add('la', 'Isolamento (lã de vidro/PET)', 'm²', r.laM2, 12);
    });
    (amb.forros||[]).filter(s=>s.ativa).forEach(s => {
      const r = calcSuperficieDrywall(s);
      const placaNome = (PLACAS_DRYWALL[s.placa]||{}).nome || s.placa;
      const tp = labelPlaca[s.tipoPlaca] || s.tipoPlaca || 'ST';
      add(`placa_${s.tipoPlaca}_${s.placa}`, `Placa Drywall ${tp} · ${placaNome}`, 'un', r.nPlacas, 1);
      add('canaleta', 'Canaleta C F530 (3,00 m)', 'barras', r.canaletaBarras, 4);
      add('tirante', 'Tirante / pendural regulável', 'un', r.nTirantes, 5);
      if (r.cantoneiraML > 0) {
        const acab = s.acabamentoPerim === 'tabica' ? (s.tabicaDesc||'Tabica de Aço') : 'Cantoneira Tipo L Perfurada';
        add(`cantoneira_${s.acabamentoPerim}`, `${acab} (perímetro)`, 'm', r.cantoneiraML, 6);
      }
      add('paraf_placa', 'GGP25 3,5×25mm (placa→metal)', 'un', r.parafusosPlaca, 8);
      add('fita', 'Fita para juntas', 'm', r.fitaML, 10);
      add('massa', 'Massa para juntas', 'kg', r.massaKg, 11);
    });
  });

  return Object.values(g)
    .map(x => ({ ...x, qtd: Math.ceil(x.qtd) }))
    .sort((a,b) => a.ordem - b.ordem || a.nome.localeCompare(b.nome));
}

// === CERÂMICA ===
// ==================== REVESTIMENTO CERÂMICO ====================
// Base: NBR 14081 (argamassa colante AC I/II/III)
 // 5,5 kg/m² (saco 20kg rende ~3,5-4,0 m² em obra)



// Calcula uma superfície individual (parede ou piso)
function calcSuperficieCeramica(s) {
  if (!s || !s.ativa) return { area:0, areaComPerda:0, argaKg:0, rejunteKg:0 };
  const perda    = nnum(s.perda) || 10;
  const acTipo   = s.argamassaTipo || 'AC1';
  const acFator  = nnum(s.argaFator) || AC_FATORES[acTipo] || 5.5;
  const rejFator = nnum(s.rejunteFator) || 0.5;
  const area     = s.modo === 'direta' ? nnum(s.areaDireta) : nnum(s.larg) * nnum(s.alt);
  const areaDesc = (s.descontos||[]).reduce((a,d) => a + nnum(d.larg)*nnum(d.alt), 0);
  const areaLiq  = Math.max(0, area - areaDesc);
  const areaComPerda = areaLiq * (1 + perda/100);
  const argaKg    = Math.ceil(areaLiq * acFator);
  const rejunteKg = Math.ceil(areaLiq * rejFator);
  return { area:areaLiq, areaComPerda, argaKg, acTipo, acFator, rejunteKg, perda };
}

// Soma superfícies de uma lista
function calcListaSuperficies(lista) {
  return (lista||[]).filter(s=>s.ativa).reduce((t,s) => {
    const r = calcSuperficieCeramica(s);
    return { area:t.area+r.area, areaComPerda:t.areaComPerda+r.areaComPerda,
             argaKg:t.argaKg+r.argaKg, rejunteKg:t.rejunteKg+r.rejunteKg };
  }, { area:0, areaComPerda:0, argaKg:0, rejunteKg:0 });
}

// Total de um ambiente (paredes + piso)
function calcAmbienteTotal(amb) {
  const rev  = calcListaSuperficies(amb.revestimentos);
  const piso = calcListaSuperficies(amb.pisos);
  return { rev, piso,
    area:rev.area+piso.area, areaComPerda:rev.areaComPerda+piso.areaComPerda,
    argaKg:rev.argaKg+piso.argaKg, rejunteKg:rev.rejunteKg+piso.rejunteKg };
}

// Total geral da medição
function calcMedicaoTotal(ambientes) {
  return (ambientes||[]).reduce((t,amb) => {
    const r = calcAmbienteTotal(amb);
    return { area:t.area+r.area, areaComPerda:t.areaComPerda+r.areaComPerda,
             argaKg:t.argaKg+r.argaKg, rejunteKg:t.rejunteKg+r.rejunteKg };
  }, { area:0, areaComPerda:0, argaKg:0, rejunteKg:0 });
}

// === MURO ===
function calcularMuro(m) {
  const L = nnum(m.altura);              // altura livre (m)
  const d = nnum(m.distPilares);         // espaçamento entre pilares (m)
  const compTotal = nnum(m.compTotal) || (d * 10); // comprimento do muro
  const V0 = nnum(m.v0);                 // velocidade básica (m/s)
  const S1 = nnum(m.s1) || 1.0;
  const S3 = nnum(m.s3) || 1.0;
  const b = nnum(m.b);                   // cm — paralela ao muro
  const h = nnum(m.h);                   // cm — perpendicular (combate o vento)
  const fck = nnum(m.fck) || 25;

  // --- Vento (NBR 6123) ---
  const S2 = calcS2(m.categoria || 'III', m.classe || 'A', L);
  const Vk = V0 * S1 * S2 * S3;
  const q = 0.613 * Vk * Vk / 1000;      // kN/m²
  const Ca = m.caManual ? nnum(m.caManual) : calcCaMuro(compTotal, L);
  const qEfetivo = Ca * q;               // kN/m² já com arrasto
  const cargaLinear = qEfetivo * d;      // kN/m no pilar
  const Mk = cargaLinear * L * L / 2;    // kN·m — momento característico na base
  const Md = 1.4 * Mk;                   // kN·m — momento de cálculo (γf = 1,4)
  const Vd = 1.4 * cargaLinear * L;      // kN — cortante de cálculo na base

  // --- Esbeltez (NBR 6118) ---
  const Le = L * 100 * 2;                // cm — balanço: Le = 2·L
  const I = (b * Math.pow(h, 3)) / 12;   // cm⁴
  const A = b * h;                       // cm²
  const i = A > 0 ? Math.sqrt(I / A) : 0;// cm
  const lambda = i > 0 ? Le / i : 0;

  // λ₁ — esbeltez limite (NBR 6118, 15.8.2). Para pilar em balanço com
  // carga transversal predominante, αb = 1,0 e e1/h ≈ 0 → λ1 = 25 (mín. 35).
  const lambda1 = 35;

  // Classificação
  let classe = '', nivel = '';
  if (lambda <= 35)        { classe = 'Pouco esbelto';             nivel = 'ok'; }
  else if (lambda <= 90)   { classe = 'Esbelto — 2ª ordem por método aproximado'; nivel = 'atencao'; }
  else if (lambda <= 140)  { classe = 'Muito esbelto — 2ª ordem obrigatória';     nivel = 'alerta'; }
  else                     { classe = 'Fora do limite normativo';  nivel = 'reprovado'; }

  // --- Verificações e alertas ---
  const alertas = [];
  if (lambda > 200) {
    alertas.push({ tipo: 'erro', txt: `Índice de esbeltez λ = ${lambda.toFixed(1)} excede 200. A NBR 6118 (item 15.8.1) não admite pilares com λ > 200, salvo postes com força normal desprezível.` });
  } else if (lambda > 140) {
    alertas.push({ tipo: 'erro', txt: `λ = ${lambda.toFixed(1)} ultrapassa 140. A NBR 6118 (15.8.3.1) exige análise rigorosa de 2ª ordem com não-linearidade física e geométrica — métodos aproximados não são permitidos.` });
  } else if (lambda > 90) {
    alertas.push({ tipo: 'aviso', txt: `λ = ${lambda.toFixed(1)} está entre 90 e 140. É obrigatório considerar os efeitos de 2ª ordem; o método do pilar-padrão com curvatura aproximada não se aplica.` });
  }
  // Dimensão mínima (NBR 6118, 13.2.3): seção transversal ≥ 19 cm e área ≥ 360 cm²
  if (Math.min(b, h) < 19) {
    alertas.push({ tipo: 'aviso', txt: `Menor dimensão da seção (${Math.min(b, h)} cm) é inferior a 19 cm. A NBR 6118 (13.2.3) admite entre 19 e 14 cm apenas com γn majorador dos esforços.` });
  }
  if (A < 360) {
    alertas.push({ tipo: 'erro', txt: `Área da seção (${A.toFixed(0)} cm²) é inferior ao mínimo de 360 cm² exigido pela NBR 6118 (13.2.3).` });
  }

  // Verificação preliminar: só é "adequada" se dispensar análise que esta
  // ferramenta não realiza. λ > 90 exige 2ª ordem → não pode ser aprovado aqui.
  const temErro = alertas.some(a => a.tipo === 'erro');
  const aprovado = !temErro && lambda <= 90;
  const exigeAnaliseAvancada = lambda > 90 && !temErro;

  return {
    L, d, compTotal, V0, S1, S2, S3, Vk, q, Ca, qEfetivo,
    cargaLinear, Mk, Md, Vd,
    b, h, Le, I, A, i, lambda, lambda1, fck,
    classe, nivel, alertas, aprovado, exigeAnaliseAvancada,
    categoria: m.categoria || 'III', classeVento: m.classe || 'A'
  };
}

function sugerirSecaoMuro(m, lambdaAlvo = 140) {
  const L = nnum(m.altura);
  const b = nnum(m.b) || 20;
  const Le = L * 100 * 2;
  // λ = Le / i  e  i = h/√12 para seção retangular na direção de h
  // → h = Le·√12 / λ
  const hNec = (Le * Math.sqrt(12)) / lambdaAlvo;
  return Math.ceil(hNec / 5) * 5;   // arredonda para múltiplo de 5 cm
}

      ${rv.camadas.map(c=>`<div style="padding:4px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:13px;">

function montarTextoAlvenaria(m) {
  const emp = state.empresa || {};
  const tot = calcMedicaoAlvenaria(m.ambientes);
  const L = ['*LISTA DE MATERIAL — ALVENARIA*', emp.nome||'CalcNBR', fmtData(m.data)];
  if (m.nome) L.push('*'+m.nome+'*');
  if (m.obra) L.push('Obra: '+m.obra);
  L.push('');
  m.ambientes.forEach(amb=>{
    const r=calcAmbienteAlvenaria(amb);
    if (r.area>0) L.push('*'+esc(amb.nome||'Ambiente')+'* — '+r.qtdBlocos+' blocos ('+fmtDec(r.area,2)+' m²)');
    // Revestimento
    const rv=calcRevestimento(amb.revestimento||{});
    if(rv.area>0){L.push('  Revestimento: '+fmtDec(rv.area,2)+' m²');rv.camadas.forEach(c=>L.push('    '+c.nome+': '+c.sacosCimento+' sc cimento · '+fmtDec(c.volAreia,3)+' m³ areia'));}
    // Contrapiso
    const cp=calcContrapiso(amb.contrapiso||{});
    if(cp.area>0) L.push('  Contrapiso: '+fmtDec(cp.area,2)+' m² · '+cp.sacosCimento+' sc cimento · '+fmtDec(cp.volAreia,3)+' m³ areia');
  });
  L.push('');
  const g = agruparComprasAlvenaria(m.ambientes);
  L.push('*RESUMO:*');
  Object.entries(g.blocos).forEach(([nome,qtd])=>L.push('  '+qtd+' un — '+nome));
  L.push('  '+g.sacosCimento+' sacos cimento (alvenaria) · '+fmtDec(g.volAreia,2)+' m³ areia');
  return L.join('\n');
}

            ${(() => { const p = PRODUTOS_IMPERM[td.produtoImperm] || PRODUTOS_IMPERM['vedbem'];

            ${td.pintarAmbasFaces === true ? `<div style="font-size:11px; color:var(--danger); margin-top:4px;">${ICON.alert} Nunca pintar apenas a face inferior — favorece fungos (manual Eternit).</div>` : ''}
          ` : ''}
        </div>
      ` : ''}

      <!-- Alertas -->
      ${r.alertas.length > 0 ? `
        <div class="card" style="border-left:3px solid ${r.alertas.some(a => a.tipo === 'erro') ? 'var(--danger)' : 'var(--accent)'};">
          ${r.alertas.map(a => `<div style="font-size:12px; color:${a.tipo === 'erro' ? '#7F1D1D' : '#7C2D12'}; margin-bottom:4px;">${ICON.alert} ${esc(a.txt)}</div>`).join('')}
        </div>
      ` : ''}

      <!-- Resultado -->
      <div id="telhado-resultado">${renderTelhadoResultado(td, r)}</div>
    </div>
  `;
}

function renderTelhadoResultado(td, r) {
  // Célula de quantidade: usa o valor ajustado se houver; em modo edição mostra input.
  const cel = (chave, valorCalc, unidade, extraStyle = '') => {
    const aj = td.ajustes && td.ajustes[chave] != null;
    const valor = aj ? td.ajustes[chave] : valorCalc;
    if (td.listaAjustada) {
      return `<td style="padding:6px; text-align:right; ${extraStyle}">
        <input type="number" step="0.01" inputmode="decimal" value="${valor}"
          onchange="actions.telhadoAjusteItem('${chave}', this.value)"
          style="width:64px; text-align:right; font-weight:700; padding:3px 4px; border:1px solid var(--border,#ccc); border-radius:4px;">
        <span style="font-size:11px; color:var(--muted);"> ${unidade}</span>
      </td>`;
    }
    return `<td style="padding:6px; text-align:right; font-weight:700; ${extraStyle}">${fmtDec(valor, valor % 1 === 0 ? 0 : 1)} ${unidade}${aj ? ' <span style="font-size:9px; color:var(--accent,#F59E0B);">✎</span>' : ''}</td>`;
  };
  return `${r.areaReal > 0 ? `
        <div class="print-page">
          <div class="card" style="background: linear-gradient(135deg, var(--primary), var(--primary-light)); color:white;">
            <div style="font-size:12px; opacity:.85;">Área real do telhado</div>

            <div style="font-size:11px; opacity:.85;">
              ${td.modo === 'direta' ? 'medida direta' : `projeção ${fmtDec(r.areaProjetada, 2)} m² × fator ${fmtDec(r.fator, 4)}`}

            <div class="row-between" style="align-items:center; margin-bottom:8px;">
              <div class="card-title" style="margin:0;">${ICON.package} Lista de material</div>
              <button class="btn btn-ghost btn-sm no-print" onclick="actions.telhadoAjustarLista()">
                ${td.listaAjustada ? '✓ Concluir ajuste' : '✎ Ajustar lista'}

            </div>
            ${td.listaAjustada ? `<div style="font-size:11px; color:var(--muted); margin-bottom:8px; background:#FFF7ED; border-left:3px solid var(--accent,#F59E0B); padding:6px 10px; border-radius:4px;">Modo ajuste: edite as quantidades ou adicione itens. Ao mudar uma medida, a lista volta ao cálculo automático.</div>` : ''}
            <table style="width:100%; border-collapse:collapse; font-size:13px;">
              <thead><tr style="background:var(--bg-soft,#F8FAFC);">
                <th style="padding:6px; text-align:left;">Material</th>
                <th style="padding:6px; text-align:right;">Quantidade</th>
              </tr></thead>
              <tbody>
                <tr>
                  <td style="padding:6px; border-bottom:1px solid #eee;">
                    <strong>${esc(r.tipo.nome)}</strong>
                    <div style="font-size:10px; color:var(--muted);">${fmtDec(r.telhasM2, 2)} telhas/m²${r.compFibro ? ` · ${fmtDec(r.compFibro, 2)} m` : ''}</div>
                  </td>
                  ${cel('telhas', r.qtdTelhas, 'un', 'border-bottom:1px solid #eee; font-size:15px;')}
                </tr>
                ${r.pesoTotal > 0 ? `<tr>
                  <td style="padding:6px; border-bottom:1px solid #eee; color:var(--muted);">Peso estimado das telhas</td>
                  <td style="padding:6px; border-bottom:1px solid #eee; text-align:right; color:var(--muted);">${fmtDec(r.pesoTotal, 0)} kg</td>
                </tr>` : ''}
                ${r.cumeeiras > 0 ? `<tr>
                  <td style="padding:6px; border-bottom:1px solid #eee;">Cumeeira <span style="font-size:10px; color:var(--muted);">(${fmtDec(r.compCumeeira, 2)} m)</span></td>

                ${r.parafusos > 0 ? `<tr>
                  <td style="padding:6px; border-bottom:1px solid #eee;">
                    ${esc(r.tipoFixacao)}

                </tr>
                ${r.madeira.ripaM ? `<tr>

                </tr>
                ${r.impermeabilizacao ? `

                  <td colspan="2" style="padding:6px; font-weight:700; color:var(--primary); font-size:12px;">IMPERMEABILIZAÇÃO</td>
                </tr>
                <tr>
                  <td style="padding:6px;">
                    <strong>${esc(r.impermeabilizacao.produto.nome)}</strong>
                    <div style="font-size:10px; color:var(--muted);">${r.impermeabilizacao.demaos} demãos · ${r.impermeabilizacao.faces === 2 ? 'ambas as faces' : 'face superior'} · ${fmtDec(r.impermeabilizacao.rendLata, 0)} m²/lata</div>
                    <div style="font-size:10px; color:var(--muted);">área a aplicar: ${fmtDec(r.impermeabilizacao.areaAplicar, 2)} m²${r.impermeabilizacao.produto.termico ? ' · com efeito térmico' : ''}</div>
                  </td>
                  <td style="padding:6px; text-align:right;">
                    <div style="font-weight:700; font-size:15px;">${r.impermeabilizacao.latas} lata(s)</div>
                    <div style="font-size:10px; color:var(--muted);">de ${fmtDec(r.impermeabilizacao.volumeLata, 0)} L · calc. ${fmtDec(r.impermeabilizacao.latasExato, 2)}</div>
                  </td>
                </tr>` : ''}
              </tbody>
            </table>
            ${(td.itensExtras && td.itensExtras.length > 0) ? `
              <table style="width:100%; border-collapse:collapse; font-size:13px; margin-top:4px;">
                <tbody>
                  <tr style="background:var(--bg-soft,#F8FAFC);">
                    <td colspan="${td.listaAjustada ? 3 : 2}" style="padding:6px; font-weight:700; color:var(--primary); font-size:12px;">ITENS ADICIONAIS</td>
                  </tr>
                  ${td.itensExtras.map((it, idx) => td.listaAjustada ? `
                    <tr>
                      <td style="padding:4px 6px; border-bottom:1px solid #eee;">
                        <input type="text" value="${esc(it.nome)}" placeholder="Nome do item"
                          onchange="actions.telhadoExtraCampo(${idx}, 'nome', this.value)"
                          style="width:100%; padding:4px; border:1px solid var(--border,#ccc); border-radius:4px;">
                      </td>
                      <td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right; white-space:nowrap;">
                        <input type="number" step="0.01" inputmode="decimal" value="${esc(it.qtd)}" placeholder="0"

                          style="width:56px; text-align:right; padding:4px; border:1px solid var(--border,#ccc); border-radius:4px;">
                        <input type="text" value="${esc(it.unidade)}" placeholder="un"

function montarTextoTelhado(r) {
  const L = [];
  L.push('*LISTA DE MATERIAL — TELHADO*');
  L.push(`${state.empresa?.nome || 'EI Construtora'}`);
  L.push('');
  L.push(`Telha: *${r.tipo.nome}*${r.compFibro ? ` ${fmtDec(r.compFibro, 2)} m` : ''}`);
  L.push(`Área real: *${fmtDec(r.areaReal, 2)} m²* · inclinação ${fmtDec(r.incl, 1)}%`);
  if (r.perdaPct > 0) L.push(`Com ${r.perdaPct}% de perda: ${fmtDec(r.areaComPerda, 2)} m²`);
  L.push('');
  L.push('*MATERIAL:*');
  const aj = (state.telhado.ajustes) || {};
  const q = (chave, calc) => (aj[chave] != null ? aj[chave] : calc);
  const marca = (chave) => (aj[chave] != null ? ' (ajustado)' : '');
  L.push(`• Telhas: *${q('telhas', r.qtdTelhas)} un*${marca('telhas')} (${fmtDec(r.telhasM2, 2)}/m²)`);
  if (r.cumeeiras > 0) L.push(`• Cumeeira: *${q('cumeeira', r.cumeeiras)} un*${marca('cumeeira')}`);
  if (r.parafusos > 0) L.push(`• ${r.tipoFixacao}: ${q('fixacao', r.parafusos)} un${marca('fixacao')}`);
  L.push('');
  L.push('*MADEIRAMENTO:*');
  if (r.madeira.ripaM) L.push(`• Ripa: *${r.madeira.nRipas} peças de ${fmtDec(r.madeira.largFachada, 2)} m* = ${fmtDec(r.madeira.ripaM, 1)} m`);
  if (r.madeira.caibroM) L.push(`• Caibro: *${r.madeira.nCaibros} peças de ${fmtDec(r.madeira.compAgua, 2)} m* = ${fmtDec(r.madeira.caibroM, 1)} m`);
  L.push(`• Terça: *${r.madeira.nTercas} peças de ${fmtDec(r.madeira.largFachada, 2)} m* = ${fmtDec(r.madeira.tercaM, 1)} m`);
  if (r.impermeabilizacao) {
    L.push('');
    L.push('*IMPERMEABILIZAÇÃO:*');
    L.push(`• ${r.impermeabilizacao.produto.nome}: *${r.impermeabilizacao.latas} lata(s) de ${fmtDec(r.impermeabilizacao.volumeLata, 0)} L*`);
    L.push(`  ${r.impermeabilizacao.demaos} demãos · ${r.impermeabilizacao.faces === 2 ? 'ambas as faces' : 'face superior'} · ${fmtDec(r.impermeabilizacao.rendLata, 0)} m²/lata`);
  }
  if (r.pesoTotal > 0) {
    L.push('');
    L.push(`Peso estimado das telhas: ${fmtDec(r.pesoTotal, 0)} kg`);
  }
  const extras = (state.telhado.itensExtras || []).filter(it => it.nome && it.nome.trim());
  if (extras.length > 0) {
    L.push('');
    L.push('*ITENS ADICIONAIS:*');
    extras.forEach(it => L.push(`• ${it.nome}: *${it.qtd || 0} ${it.unidade || 'un'}*`));
  }
  return L.join('\n');
}

      ${f.cantoneiraML>0?linha('Cantoneira',f.cantoneiraML+' m',''):''}

function montarTextoDrywall(m) {
  const emp=state.empresa||{};
  const tot=calcMedicaoDrywall(m.ambientes);
  const L=['*LISTA DE MATERIAL — DRYWALL*',emp.nome||'CalcNBR',fmtData(m.data)];
  if(m.nome)L.push('*'+m.nome+'*');
  if(m.obra)L.push('Obra: '+m.obra);
  L.push('');
  m.ambientes.forEach(amb=>{
    const r=calcAmbienteDrywall(amb);
    if(r.area<=0)return;
    L.push('*'+esc(amb.nome||'Ambiente')+'* — '+r.nPlacas+' placas');
    const p=r.paredes,f=r.forros;
    if(p.area>0){
      L.push('  Paredes: '+fmtDec(p.area,2)+' m² → '+p.nPlacas+' placas');
      L.push('  Guias: '+p.guiaBarras+' barras | Montantes: '+p.montanteBarras+' barras');
    }
    if(f.area>0){
      L.push('  Forro: '+fmtDec(f.area,2)+' m² → '+f.nPlacas+' placas');
      L.push('  Canaleta: '+f.canaletaBarras+' barras | Tirantes: '+f.nTirantes+' un');
    }
  });
  L.push('');
  L.push('*TOTAL: '+tot.nPlacas+' placas · '+fmtDec(tot.area,2)+' m²*');
  L.push('Parafusos: '+(tot.parafusosPlaca+tot.parafusosMetal)+' | Fita: '+tot.fitaML+' m | Massa: '+tot.massaKg+' kg');
  L.push('');
  L.push('_Base: NBR 15758:2025. Valores estimados._');
  return L.join('\n');
}

function renderSuperficieTotal(s) {
  const r=calcSuperficieCeramica(s);
  return r.area>0 ? fmtDec(r.area,2)+' m²' : '—';
}

function renderAmbienteTotal(amb) {
  const r=calcAmbienteTotal(amb);
  if(r.area<=0) return '<div style="text-align:center;color:var(--muted);font-size:13px;padding:8px;">Preencha as medidas para calcular.</div>';
  const sacos = Math.ceil(r.argaKg/20);
  return `
    <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark,#1a3a5c));color:white;margin-top:0;">
      <div style="font-size:12px;opacity:0.8;">TOTAL DO AMBIENTE</div>
      <div style="font-size:24px;font-weight:800;">${fmtDec(r.area,2)} m²</div>
      <div class="row flex-wrap" style="gap:16px;font-size:13px;margin-top:6px;">
        ${r.rev.area>0?`<span>Paredes: ${fmtDec(r.rev.area,2)} m²</span>`:''}
        ${r.piso.area>0?`<span>Piso: ${fmtDec(r.piso.area,2)} m²</span>`:''}
        <span>🪣 Arg.: ${r.argaKg} kg (${sacos} saco${sacos>1?'s':''})</span>
        <span>Rej.: ${r.rejunteKg} kg</span>
      </div>
    </div>`;
}

  const emp=state.empresa||{};
  const tot=calcMedicaoTotal(m.ambientes);
  const hoje=fmtData(today());

    const r=calcSuperficieCeramica(s);
    return `<tr style="border-bottom:1px solid #eee;${!s.ativa?'opacity:0.35;':''}">

  };

    <div class="stack">

        <button class="back-btn" onclick="actions.abrirMedicaoCeramica('${m.id}')">${ICON.chevronLeft} Voltar</button>

          <div class="recibo-empresa">

            <div class="recibo-empresa-dados">${emp.cnpj?'CNPJ '+esc(emp.cnpj):''}${emp.telefone?'<br>Tel: '+esc(emp.telefone):''}${emp.email?' • '+esc(emp.email):''}</div>
          </div>
        </div>
        <div class="recibo-titulo">
          <h1>MEDIÇÃO DE REVESTIMENTO CERÂMICO</h1>
          ${m.nome?`<div style="font-size:14px;font-weight:600;color:var(--primary);">${esc(m.nome)}</div>`:''}
          ${m.obra?`<div style="font-size:13px;color:var(--muted);">Obra: ${esc(m.obra)}</div>`:''}
          <div style="font-size:12px;color:var(--muted);">${hoje}</div>
        </div>
        <div class="recibo-corpo">
          ${m.ambientes.map(amb=>{
            const r=calcAmbienteTotal(amb);
            const thStyle='padding:7px 8px;text-align:';
            const tabHeader=`<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;">
              <thead><tr style="background:var(--primary);color:white;">
                <th style="${thStyle}left;">Superfície</th>
                <th style="${thStyle}center;width:44px;">AC</th>
                <th style="${thStyle}right;width:90px;">Cerâmica(m²)</th>
                <th style="${thStyle}right;width:80px;">Argamassa(kg)</th>
                <th style="${thStyle}right;width:72px;">Rejunte(kg)</th>
              </tr></thead><tbody>`;
            return `
              <h2 style="font-size:14px;font-weight:700;color:var(--primary);margin:20px 0 6px;border-bottom:2px solid var(--primary);padding-bottom:4px;">
                ${esc(amb.nome||'Ambiente')}
              </h2>
              ${amb.revestimentos.length>0?`
                <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;">▸ REVESTIMENTO (PAREDES)</div>
                ${tabHeader}${amb.revestimentos.map(s=>linhaSuperficie(s,'revestimento')).join('')}</tbody>
                <tfoot><tr style="background:var(--bg-soft);font-weight:700;">
                  <td colspan="2" style="padding:7px 8px;">Subtotal paredes</td>
                  <td style="padding:7px 8px;text-align:right;">${fmtDec(r.rev.areaComPerda,2)} m²</td>

                </tr></tfoot></table>`:''}
              ${amb.pisos.length>0?`
                <div style="font-size:11px;font-weight:600;color:var(--muted);margin:10px 0 4px;">▸ PISO</div>
                ${tabHeader}${amb.pisos.map(s=>linhaSuperficie(s,'piso')).join('')}</tbody>

                  <td style="padding:7px 8px;text-align:right;">${fmtDec(r.piso.areaComPerda,2)} m²</td>
                  <td style="padding:7px 8px;text-align:right;">${r.piso.argaKg} kg</td>
                  <td style="padding:7px 8px;text-align:right;">${r.piso.rejunteKg} kg</td>

          ${(()=>{
            // RESUMO DE COMPRAS: agrupa por tipo de argamassa e totaliza
            const acTotais={};
            let rejTotal=0, ceramicaRev=0, ceramicaPiso=0;
            m.ambientes.forEach(amb=>{
              (amb.revestimentos||[]).forEach(s=>{
                if(!s.ativa)return;
                const r=calcSuperficieCeramica(s);
                acTotais[s.argamassaTipo||'AC1']=(acTotais[s.argamassaTipo||'AC1']||0)+r.argaKg;
                rejTotal+=r.rejunteKg;
                ceramicaRev+=r.areaComPerda;
              });
              (amb.pisos||[]).forEach(s=>{
                if(!s.ativa)return;
                const r=calcSuperficieCeramica(s);

              <td style="padding:10px 14px;font-size:20px;font-weight:800;color:var(--primary);text-align:right;">${qtd}</td>
              <td style="padding:10px 14px;font-size:14px;font-weight:600;">${un}</td>
              <td style="padding:10px 14px;font-size:11px;color:var(--muted);">${obs}</td>
            </tr>`;
            const acLinhas=Object.entries(acTotais).sort(([a],[b])=>a.localeCompare(b))
              .map(([ac,kg])=>tr(`Argamassa ${ac}`,Math.ceil(kg/20),'sacos 20kg',`${kg} kg total · ~${fmtDec(kg/5.5,1)} m²`)).join('');
            return `
              <div style="margin-top:28px;border:2px solid var(--primary);border-radius:10px;overflow:hidden;page-break-inside:avoid;">
                <div style="background:var(--primary);color:white;padding:10px 16px;font-size:15px;font-weight:800;">🛒 RESUMO DE COMPRAS</div>
                <table style="width:100%;border-collapse:collapse;">
                  <tbody>
                    ${ceramicaRev>0?tr('Cerâmica — Revestimento',fmtDec(ceramicaRev,2),'m²','paredes · perda incluída'):''}
                    ${ceramicaPiso>0?tr('Cerâmica — Piso',fmtDec(ceramicaPiso,2),'m²','piso · perda incluída'):''}
                    ${acLinhas}
                    ${tr('Rejunte',Math.ceil(rejTotal),'kg',`~${Math.ceil(rejTotal/5)} sacos de 5kg`)}
                  </tbody>
                </table>
              </div>`;
          })()}

          <div style="margin-top:12px;font-size:10px;color:var(--muted);border-top:1px solid var(--border);padding-top:8px;">
            Consumo argamassa: 5,5 kg/m² — base campo (saco 20kg rende 3,5–4,0 m²). Editável por superfície. Valores estimados.
          </div>
        </div>
      </div>
    </div>`;
}

function montarTextoMedicaoCeramica(m) {
  const emp=state.empresa||{};
  const tot=calcMedicaoTotal(m.ambientes);
  const L=['*MEDIÇÃO DE REVESTIMENTO CERÂMICO*',emp.nome||'EI Construtora',fmtData(m.data)];
  if(m.nome)L.push('*'+m.nome+'*');
  if(m.obra)L.push('Obra: '+m.obra);
  L.push('');
  m.ambientes.forEach(amb=>{
    const r=calcAmbienteTotal(amb);
    if(r.area<=0)return;
    L.push('*'+esc(amb.nome||'Ambiente')+'*');
    if(r.rev.area>0){
      L.push('  Paredes: '+fmtDec(r.rev.area,2)+' m²');
      L.push('  Arg. '+r.rev.acTipo+': '+r.rev.argaKg+' kg ('+Math.ceil(r.rev.argaKg/20)+' sacos) | Rej.: '+r.rev.rejunteKg+' kg');
    }
    if(r.piso.area>0){
      L.push('  Piso: '+fmtDec(r.piso.area,2)+' m²');
      L.push('  Arg.: '+r.piso.argaKg+' kg ('+Math.ceil(r.piso.argaKg/20)+' sacos) | Rej.: '+r.piso.rejunteKg+' kg');
    }
  });
  if(m.ambientes.length>1){
    L.push('');
    L.push('*TOTAL: '+fmtDec(tot.area,2)+' m² · '+tot.argaKg+' kg arg. ('+Math.ceil(tot.argaKg/20)+' sacos)*');
  }
  return L.join('\n');
}

function montarTextoMuro(r) {
  const L = [];
  L.push('*VERIFICAÇÃO PRELIMINAR — MURO*');
  L.push(`${state.empresa?.nome || 'EI Construtora'}`);
  L.push('');
  L.push(`Muro: ${fmtDec(r.L, 2)} m de altura · pilares a cada ${fmtDec(r.d, 2)} m`);
  L.push(`Seção: ${fmtDec(r.b, 0)} × ${fmtDec(r.h, 0)} cm`);
  L.push('');
  L.push('*VENTO (NBR 6123)*');
  L.push(`Vk = ${fmtDec(r.Vk, 2)} m/s · Ca = ${fmtDec(r.Ca, 2)}`);
  L.push(`Momento na base: *${fmtDec(r.Mk, 2)} kN·m*`);
  L.push(`Momento de cálculo: *${fmtDec(r.Md, 2)} kN·m*`);
  L.push('');
  L.push('*ESBELTEZ (NBR 6118)*');
  L.push(`λ = *${fmtDec(r.lambda, 1)}* — ${r.classe}`);
  L.push('');
  L.push(r.aprovado ? '✅ Seção adequada na verificação preliminar' : '⚠️ SEÇÃO NÃO APROVADA');

  L.push('_Verificação preliminar. Não substitui dimensionamento estrutural._');
  return L.join('\n');
}

// ==================== CALCULADORA DE CONCRETO ====================
// Base: NBR 6118:2014, NBR 12655:2022
const CAA_REQUISITOS = {
  'I':   { desc: 'Rural / submersa (fraca)',        fckMin: 20, acMax: 0.65 },
  'II':  { desc: 'Urbana (moderada)',               fckMin: 25, acMax: 0.60 },
  'III': { desc: 'Marinha / industrial (forte)',    fckMin: 30, acMax: 0.55 },
  'IV':  { desc: 'Respingos de maré (muito forte)', fckMin: 40, acMax: 0.45 }
};

// Traços práticos validados em obra (NBR 6118/12655)
// traco: proporção em volume (cimento : areia : brita)
// pAreia/pBrita: latas de agregado por saco de cimento
const TRACOS_CONCRETO = {
  15: { traco: '1 : 3,5 : 4,5', cimento: 320, areia: 0.55, brita: 0.85, agua: 180, pAreia: 3.5, pBrita: 4.5 },
  20: { traco: '1 : 3 : 4',     cimento: 360, areia: 0.53, brita: 0.83, agua: 185, pAreia: 3,   pBrita: 4   },
  25: { traco: '1 : 2,5 : 3,5', cimento: 400, areia: 0.50, brita: 0.80, agua: 190, pAreia: 2.5, pBrita: 3.5 },
  30: { traco: '1 : 2 : 3',     cimento: 440, areia: 0.48, brita: 0.77, agua: 195, pAreia: 2,   pBrita: 3   }
};

// Padrão de obra: a lata rende 52 unidades por m³ (≈19,2 L).
// 1 saco de cimento (50 kg) equivale a 2 latas na medição em volume.
const LATAS_POR_M3   = 52;
const LATAS_POR_SACO = 2;

// Volumes — fórmulas conforme a calculadora original.
const volLaje    = l => l.metodo === 'area' ? nnum(l.area) * nnum(l.espessura) : nnum(l.comprimento) * nnum(l.largura) * nnum(l.espessura);
const volPilar   = p => { const sec = p.tipo === 'circular' ? Math.PI * Math.pow(nnum(p.diametro) / 2, 2) : nnum(p.b) * nnum(p.h); return sec * nnum(p.altura) * (nnum(p.quantidade) || 1); };
const volViga    = v => nnum(v.b) * nnum(v.h) * nnum(v.comprimento) * (nnum(v.quantidade) || 1);
const volSapata  = s => s.tipo === 'corrida'
  ? nnum(s.a) * nnum(s.b) * nnum(s.h) * (nnum(s.quantidade) || 1)   // a=largura, b=comprimento
  : nnum(s.a) * nnum(s.b) * nnum(s.h) * (nnum(s.quantidade) || 1);

// Calcula tudo: volumes, perda, insumos e verificação normativa.

function calcularConcreto() {
  const c = state.concreto;
  const tL = (c.lajes || []).reduce((s, x) => s + volLaje(x), 0);
  const tP = (c.pilares || []).reduce((s, x) => s + volPilar(x), 0);
  const tV = (c.vigas || []).reduce((s, x) => s + volViga(x), 0);
  const tS = (c.sapatas || []).reduce((s, x) => s + volSapata(x), 0);
  const bruto = tL + tP + tV + tS;
  const perdaPct = nnum(c.perda);
  const final = bruto * (1 + perdaPct / 100);
  const t = TRACOS_CONCRETO[c.fck] || TRACOS_CONCRETO[25];

  // Insumos (concreto virado em obra)
  const cimentoKg = t.cimento * final;
  const sacos = cimentoKg / 50;
  const areiaM3 = t.areia * final;
  const britaM3 = t.brita * final;
  const aguaL = t.agua * final;
  const relacaoAC = t.agua / t.cimento;

  // Verificação normativa (NBR 6118 / 12655) para a classe escolhida
  const req = CAA_REQUISITOS[c.caa] || CAA_REQUISITOS['III'];
  const alertas = [];
  if (c.fck < req.fckMin) {
    alertas.push(`Para classe de agressividade ${c.caa} (${req.desc}), a NBR 6118 exige fck mínimo de ${req.fckMin} MPa para concreto armado. O fck selecionado é ${c.fck} MPa.`);
  }
  if (relacaoAC > req.acMax) {
    alertas.push(`A relação água/cimento deste traço (${relacaoAC.toFixed(2)}) excede o máximo de ${req.acMax.toFixed(2)} exigido para a classe ${c.caa}.`);
  }

  // Verificação sapatas — NBR 6122:2019, item 7.2 (dimensão mínima 0,60 m)
  (c.sapatas || []).forEach(s => {
    const a = nnum(s.a), b = nnum(s.b);
    const menorLado = Math.min(a, b);
    if (menorLado > 0 && menorLado < 0.60) {
      const id = s.nome ? `"${s.nome}"` : `${fmtDec(a,2)}×${fmtDec(b,2)} m`;
      alertas.push(`⚠ NBR 6122:2019 · item 7.2 — Sapata ${id}: menor dimensão (${fmtDec(menorLado,2)} m) abaixo do mínimo recomendado de 0,60 m. Em alguns casos o software estrutural aceita essa dimensão com base na capacidade de carga total — verifique com o projetista estrutural.`);
    }
  });

  return {
    tL, tP, tV, tS, bruto, final, perdaPct, perdaM3: final - bruto,
    traco: t, cimentoKg, sacos, areiaM3, britaM3, aguaL, relacaoAC,
    req, alertas,
    nItens: (c.lajes || []).length + (c.pilares || []).length + (c.vigas || []).length + (c.sapatas || []).length
  };
}

function listaCompraConcreto(r) {
  // Arredondamento prático: meio saco para cima (4,03 → 4 · 4,60 → 5).
  // Evita comprar um saco inteiro a mais por causa de alguns quilos.
  const sacos = Math.max(1, Math.round(r.sacos));
  const t = r.traco;
  const latasAreia = Math.round(t.pAreia * LATAS_POR_SACO * sacos);
  const latasBrita = Math.round(t.pBrita * LATAS_POR_SACO * sacos);
  return {
    sacos,
    sacosExato: r.sacos,
    latasAreia,
    latasBrita,
    areiaM3: latasAreia / LATAS_POR_M3,
    britaM3: latasBrita / LATAS_POR_M3,
    aguaL: Math.ceil(r.aguaL / 10) * 10,
    latasPorSaco: LATAS_POR_SACO
  };
}

      ${bloco('Pilares', 'pilares', c.pilares || [], x => x.tipo === 'circular' ? `Ø${fmtDec(x.diametro, 2)} × ${fmtDec(x.altura, 2)} m · ${x.quantidade}un` : `${fmtDec(x.b, 2)}×${fmtDec(x.h, 2)} × ${fmtDec(x.altura, 2)} m · ${x.quantidade}un`, volPilar)}

      ${bloco('Sapatas', 'sapatas', c.sapatas || [], x => `${fmtDec(x.a, 2)}×${fmtDec(x.b, 2)}×${fmtDec(x.h, 2)} m · ${x.quantidade}un`, volSapata)}

function montarTextoConcreto(r) {
  const c = state.concreto;
  const L = [];
  L.push('*LISTA DE MATERIAL — CONCRETO*');
  L.push(`${state.empresa?.nome || 'EI Construtora'}`);
  L.push('');
  L.push(`Volume: *${fmtDec(r.final, 2)} m³* (com ${r.perdaPct}% de perda)`);
  L.push(`Resistência: fck ${c.fck} MPa`);
  L.push('');
  if (c.modo === 'usinado') {
    L.push('*PEDIDO — CONCRETO USINADO*');
    L.push(`Volume: ${fmtDec(r.final, 2)} m³`);
    L.push(`fck: ${c.fck} MPa`);
  } else {
    const lc = listaCompraConcreto(r);
    L.push('*MATERIAL PARA COMPRAR:*');
    L.push(`• Cimento CP-II: *${lc.sacos} sacos* (50 kg)`);
    L.push(`• Areia média: *${lc.latasAreia} latas* (${fmtDec(lc.areiaM3, 2)} m³)`);
    L.push(`• Brita 1: *${lc.latasBrita} latas* (${fmtDec(lc.britaM3, 2)} m³)`);
    L.push(`• Água: ${lc.aguaL} L`);
    L.push('');
    L.push(`Traço ${r.traco.traco} em volume · por saco: ${fmtDec(r.traco.pAreia * lc.latasPorSaco, 0)} latas areia e ${fmtDec(r.traco.pBrita * lc.latasPorSaco, 0)} latas brita`);
    L.push(`(1 m³ = ${LATAS_POR_M3} latas · a/c ${fmtDec(r.relacaoAC, 2)})`);
  }
  L.push('');
  L.push('*Composição do volume:*');
  if (r.tL > 0) L.push(`Lajes: ${fmtDec(r.tL, 2)} m³`);
  if (r.tP > 0) L.push(`Pilares: ${fmtDec(r.tP, 2)} m³`);
  if (r.tV > 0) L.push(`Vigas: ${fmtDec(r.tV, 2)} m³`);
  if (r.tS > 0) L.push(`Sapatas: ${fmtDec(r.tS, 2)} m³`);
  return L.join('\n');
}

                <td style="padding:3px 6px; border-bottom:1px solid #eee;">${x.tipo === 'circular' ? 'Ø ' + fmtDec(x.diametro, 2) + ' m' : fmtDec(x.b, 2) + ' × ' + fmtDec(x.h, 2) + ' m'}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee; text-align:right;">${fmtDec(x.altura, 2)}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee; text-align:right;">${x.quantidade || 1}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee; text-align:right; font-weight:600;">${fmtDec(volPilar(x), 3)}</td>
              </tr>`)}

            ${tabelaElementos('VIGAS', c.vigas || [], r.tV,
              [{ t: 'Identificação' }, { t: 'Seção' }, { t: 'Compr. (m)', a: 'right' }, { t: 'Qtd', a: 'right' }, { t: 'Volume (m³)', a: 'right' }],
              (x, i) => `<tr>
                <td style="padding:3px 6px; border-bottom:1px solid #eee;">${i + 1}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee;">${esc(x.nome)}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee;">${fmtDec(x.b, 2)} × ${fmtDec(x.h, 2)} m</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee; text-align:right;">${fmtDec(x.comprimento, 2)}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee; text-align:right;">${x.quantidade || 1}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee; text-align:right; font-weight:600;">${fmtDec(volViga(x), 3)}</td>
              </tr>`)}

            ${tabelaElementos('SAPATAS', c.sapatas || [], r.tS,
              [{ t: 'Identificação' }, { t: 'Dimensões' }, { t: 'Altura (m)', a: 'right' }, { t: 'Qtd', a: 'right' }, { t: 'Volume (m³)', a: 'right' }],
              (x, i) => `<tr>
                <td style="padding:3px 6px; border-bottom:1px solid #eee;">${i + 1}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee;">${esc(x.nome)}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee;">${fmtDec(x.a, 2)} × ${fmtDec(x.b, 2)} m${x.tipo === 'corrida' ? ' (corrida)' : ''}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee; text-align:right;">${fmtDec(x.h, 2)}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee; text-align:right;">${x.quantidade || 1}</td>
                <td style="padding:3px 6px; border-bottom:1px solid #eee; text-align:right; font-weight:600;">${fmtDec(volSapata(x), 3)}</td>
              </tr>`)}
          </div>

          <!-- Resumo geral -->
          <div style="font-size:12px; font-weight:700; color:var(--primary); border-bottom:2px solid var(--primary); padding-bottom:3px; margin:16px 0 6px;">RESUMO GERAL</div>
          <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:10px;">
            ${[['Lajes/Pisos', r.tL, (c.lajes || []).length], ['Pilares', r.tP, (c.pilares || []).length],
               ['Vigas', r.tV, (c.vigas || []).length], ['Sapatas', r.tS, (c.sapatas || []).length]].map(([n, v, q]) => `
              <div style="background:var(--bg-soft,#F8FAFC); border-radius:6px; padding:6px; text-align:center;">
                <div style="font-size:9px; color:var(--muted); text-transform:uppercase;">${n}</div>
                <div style="font-weight:700; font-size:13px;">${fmtDec(v, 3)} m³</div>
                <div style="font-size:9px; color:var(--muted);">${q} ${q === 1 ? 'item' : 'itens'}</div>
              </div>`).join('')}
          </div>
          <table style="width:100%; border-collapse:collapse; font-size:12px;">
            <tr><td style="padding:4px 6px;">Volume bruto</td><td style="padding:4px 6px; text-align:right; font-weight:600;">${fmtDec(r.bruto, 3)} m³</td></tr>
            <tr><td style="padding:4px 6px;">Perda (${r.perdaPct}%)</td><td style="padding:4px 6px; text-align:right; font-weight:600;">+ ${fmtDec(r.perdaM3, 3)} m³</td></tr>
            <tr style="border-top:2px solid var(--primary);"><td style="padding:6px;"><strong>VOLUME FINAL</strong></td><td style="padding:6px; text-align:right;"><strong style="font-size:15px; color:var(--primary);">${fmtDec(r.final, 3)} m³</strong></td></tr>
          </table>

          <!-- Insumos ou pedido -->
          ${c.modo === 'usinado' ? `
            <div style="font-size:12px; font-weight:700; color:var(--primary); border-bottom:2px solid var(--primary); padding-bottom:3px; margin:16px 0 6px;">PEDIDO PARA CONCRETEIRA</div>
            <table style="width:100%; border-collapse:collapse; font-size:12px;">
              <tr><td style="padding:4px 6px; border-bottom:1px solid #eee;">Volume solicitado</td><td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right; font-weight:700;">${fmtDec(r.final, 2)} m³</td></tr>
              <tr><td style="padding:4px 6px; border-bottom:1px solid #eee;">Resistência característica (fck)</td><td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right; font-weight:700;">${c.fck} MPa</td></tr>
              <tr><td style="padding:4px 6px;">Traço de referência</td><td style="padding:4px 6px; text-align:right;">${r.traco.traco}</td></tr>
            </table>
          ` : `
            <div style="font-size:12px; font-weight:700; color:var(--primary); border-bottom:2px solid var(--primary); padding-bottom:3px; margin:16px 0 6px;">INSUMOS — CONCRETO VIRADO EM OBRA</div>
            <p style="font-size:11px; color:var(--muted); margin:0 0 6px;">
              Para ${fmtDec(r.final, 2)} m³ de concreto fck ${c.fck} MPa · Traço de referência ${r.traco.traco} (cimento : areia : brita)
            </p>
            <table style="width:100%; border-collapse:collapse; font-size:12px;">
              <thead><tr style="background:var(--bg-soft,#F8FAFC);">
                <th style="padding:4px 6px; text-align:left;">Material</th>
                <th style="padding:4px 6px; text-align:right;">Calculado</th>
                <th style="padding:4px 6px; text-align:right;">Latas</th>
                <th style="padding:4px 6px; text-align:right;">Comprar</th>
              </tr></thead>
              <tbody>
                <tr>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee;">Cimento CP-II (50 kg)</td>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right; color:var(--muted);">${fmtDec(lc.sacosExato, 2)} sacos · ${fmtDec(r.cimentoKg, 0)} kg</td>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right;">${lc.sacos * lc.latasPorSaco}</td>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right; font-weight:700;">${lc.sacos} sacos</td>
                </tr>
                <tr>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee;">Areia média</td>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right; color:var(--muted);">≈ ${fmtDec(areiaKg, 0)} kg</td>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right; font-weight:700;">${lc.latasAreia}</td>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right; font-weight:700;">${fmtDec(lc.areiaM3, 2)} m³</td>
                </tr>
                <tr>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee;">Brita 1</td>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right; color:var(--muted);">≈ ${fmtDec(britaKg, 0)} kg</td>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right; font-weight:700;">${lc.latasBrita}</td>
                  <td style="padding:4px 6px; border-bottom:1px solid #eee; text-align:right; font-weight:700;">${fmtDec(lc.britaM3, 2)} m³</td>
                </tr>
                <tr>
                  <td style="padding:4px 6px;">Água</td>
                  <td style="padding:4px 6px; text-align:right; color:var(--muted);">a/c ≈ ${fmtDec(r.relacaoAC, 2)}</td>
                  <td style="padding:4px 6px; text-align:right;">—</td>
                  <td style="padding:4px 6px; text-align:right; font-weight:700;">${lc.aguaL} L</td>
                </tr>
              </tbody>
            </table>
            <p style="font-size:10px; color:var(--muted); margin-top:6px;">
              Medida em volume conforme prática local: 1 m³ = ${LATAS_POR_M3} latas · 1 saco de cimento = ${lc.latasPorSaco} latas.
              Por saco: ${fmtDec(r.traco.pAreia * lc.latasPorSaco, 0)} latas de areia e ${fmtDec(r.traco.pBrita * lc.latasPorSaco, 0)} latas de brita.
            </p>
          `}

          <!-- Alertas normativos -->
          ${r.alertas.length > 0 ? `
            <div style="background:#FEF2F2; border-left:3px solid var(--danger); border-radius:4px; padding:8px 10px; margin-top:12px;">
              <div style="font-size:11px; font-weight:700; color:var(--danger); margin-bottom:3px;">VERIFICAÇÃO DE DURABILIDADE</div>
              ${r.alertas.map(a => `<div style="font-size:10px; color:#7F1D1D;">${esc(a)}</div>`).join('')}
            </div>
          ` : ''}

          <!-- Nota técnica -->
          <div style="background:var(--bg-soft,#F8FAFC); border-radius:6px; padding:8px 10px; margin-top:12px;">
            <div style="font-size:10px; font-weight:700; color:var(--primary); margin-bottom:3px;">NOTA TÉCNICA</div>
            <p style="font-size:10px; color:#444; margin:0; line-height:1.5;">
              Traço de referência de uso prático. Para concreto estrutural, a dosagem experimental deve ser
              realizada conforme a <strong>NBR 12655</strong> (concreto de cimento Portland — preparo, controle e recebimento)
              e a <strong>NBR 12821</strong> (preparação de concreto em laboratório), por profissional habilitado.
              As quantidades de areia e brita são expressas em volume aparente, devendo ser ajustadas conforme o
              inchamento real e a granulometria dos agregados disponíveis. Os requisitos de durabilidade seguem a
              <strong>NBR 6118</strong>, conforme a classe de agressividade ambiental do local da obra.
            </p>
          </div>

          <!-- Assinatura técnica -->
          <div class="recibo-assinaturas" style="grid-template-columns:1fr; margin-top:40px;">
            <div class="recibo-assinatura">
              <div class="assinatura-linha"></div>
              <div class="assinatura-nome">${esc(emp.responsavel || emp.nome || 'Responsável Técnico')}</div>
              <div class="assinatura-cargo">
                Responsável Técnico
                ${emp.crea ? `<br>${esc(emp.crea)}` : ''}
                ${emp.crt ? ` · ${esc(emp.crt)}` : ''}
              </div>
            </div>
          </div>

          <p class="recibo-local-data" style="text-align:center; margin-top:14px;">${esc(emp.cidade || '____')}, ${esc(fmtDataExtenso(today()))}.</p>
        </div>

        <div class="recibo-rodape">
          ${esc(emp.nome || 'Sua Empresa')} ${emp.cnpj ? '• CNPJ ' + esc(emp.cnpj) : ''} • Documento gerado em ${hoje}
        </div>
      </div>
    </div>
  `;
}


function renderListaMaterial() {
